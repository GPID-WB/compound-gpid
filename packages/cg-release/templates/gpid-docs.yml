# Disabled GPID installation. Review pins, bridge, policy and environments before activation.
name: Release controller documentation
run-name: release-docs ${{ inputs.nonce }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      nonce:
        required: true
        type: string
permissions:
  contents: read
# Registration must not wait in the lossy Pages pending queue.
env:
  CG_RELEASE_CONTROLLER_REVISION: ${{ vars.CG_RELEASE_CONTROLLER_REVISION }}
  CG_RELEASE_WHEEL_SHA256: ${{ vars.CG_RELEASE_WHEEL_SHA256 }}
  CONTROLLER_WHEEL_URL: ${{ vars.CG_RELEASE_CONTROLLER_WHEEL_URL }}
  REQUEST_ID: ${{ inputs.request_id }}
  NONCE: ${{ inputs.nonce }}
jobs:
  register:
    name: register
    if: ${{ false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release-control
    outputs:
      dev_sha: ${{ steps.register.outputs.dev_sha }}
      stable_tag: ${{ steps.register.outputs.stable_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ vars.CG_RELEASE_CONTROLLER_REPOSITORY }}
          ref: ${{ env.CG_RELEASE_CONTROLLER_REVISION }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned trusted worker
        run: |
          set -euo pipefail
          [[ "$CG_RELEASE_CONTROLLER_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CG_RELEASE_WHEEL_SHA256" =~ ^[0-9a-f]{64}$ ]]
          python -m pip install uv==0.11.3
          uv sync --project packages/cg-release --python 3.12 --locked --no-install-project
          curl --fail --proto '=https' --tlsv1.2 "$CONTROLLER_WHEEL_URL" -o cg_release-0.1.0-py3-none-any.whl
          printf '%s  %s\n' "$CG_RELEASE_WHEEL_SHA256" cg_release-0.1.0-py3-none-any.whl | sha256sum --check --strict
          uv pip install --link-mode copy --python packages/cg-release/.venv/bin/python --no-deps cg_release-0.1.0-py3-none-any.whl
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app
        with:
          app-id: ${{ secrets.RELEASE_CONTROL_APP_ID }}
          private-key: ${{ secrets.RELEASE_CONTROL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-actions: read
          permission-issues: read
          permission-pull-requests: read
          permission-administration: read
          permission-environments: read
          permission-secrets: read
      - name: Bind exact dev source before unprivileged execution
        id: register
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: packages/cg-release/.venv/bin/python -I -m cg_release.profile_worker register --request-id "$REQUEST_ID" --nonce "$NONCE"
  dev-preview:
    name: dev-preview
    needs: register
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CG_RELEASE_SOURCE_JOB: 'true'
      CG_RELEASE_SOURCE_SHA: ${{ needs.register.outputs.dev_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.register.outputs.dev_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/release_profile_build.py --dev
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dev-docs
          path: release-output/dev-docs.json
          if-no-files-found: error
  compose:
    name: compose
    needs: [register, dev-preview]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-control
    outputs:
      manifest_sha256: ${{ steps.compose.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ vars.CG_RELEASE_CONTROLLER_REPOSITORY }}
          ref: ${{ env.CG_RELEASE_CONTROLLER_REVISION }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned static-data composer
        run: |
          set -euo pipefail
          python -m pip install uv==0.11.3
          uv sync --project packages/cg-release --python 3.12 --locked --no-install-project
          curl --fail --proto '=https' --tlsv1.2 "$CONTROLLER_WHEEL_URL" -o cg_release-0.1.0-py3-none-any.whl
          printf '%s  %s\n' "$CG_RELEASE_WHEEL_SHA256" cg_release-0.1.0-py3-none-any.whl | sha256sum --check --strict
          uv pip install --link-mode copy --python packages/cg-release/.venv/bin/python --no-deps cg_release-0.1.0-py3-none-any.whl
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dev-docs
          path: dev-artifact
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app
        with:
          app-id: ${{ secrets.RELEASE_CONTROL_APP_ID }}
          private-key: ${{ secrets.RELEASE_CONTROL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-actions: read
          permission-issues: read
          permission-pull-requests: read
          permission-administration: read
          permission-environments: read
          permission-secrets: read
      - id: compose
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: packages/cg-release/.venv/bin/python -I -m cg_release.profile_worker compose --request-id "$REQUEST_ID" --nonce "$NONCE" --root "$GITHUB_WORKSPACE/composition"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: composed-docs
          path: composition/deployment/
          include-hidden-files: true
          if-no-files-found: error
  deploy:
    name: deploy
    concurrency:
      group: pages
      cancel-in-progress: false
    needs: [register, compose]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      # This job never executes release/dev source. The read-only App credential
      # must be installed in the protected default-ref github-pages environment.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ vars.CG_RELEASE_CONTROLLER_REPOSITORY }}
          ref: ${{ env.CG_RELEASE_CONTROLLER_REVISION }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned read-only authority worker
        run: |
          set -euo pipefail
          [[ "$CG_RELEASE_CONTROLLER_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CG_RELEASE_WHEEL_SHA256" =~ ^[0-9a-f]{64}$ ]]
          python -m pip install uv==0.11.3
          uv sync --project packages/cg-release --python 3.12 --locked --no-install-project
          curl --fail --proto '=https' --tlsv1.2 "$CONTROLLER_WHEEL_URL" -o cg_release-0.1.0-py3-none-any.whl
          printf '%s  %s\n' "$CG_RELEASE_WHEEL_SHA256" cg_release-0.1.0-py3-none-any.whl | sha256sum --check --strict
          uv pip install --link-mode copy --python packages/cg-release/.venv/bin/python --no-deps cg_release-0.1.0-py3-none-any.whl
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: composed-docs
          path: composition
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify exact trusted composition and mutable freshness
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_SHA256: ${{ needs.compose.outputs.manifest_sha256 }}
          DEV_SHA: ${{ needs.register.outputs.dev_sha }}
          STABLE_TAG: ${{ needs.register.outputs.stable_tag }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$MANIFEST_SHA256" composition/.docs-deployment.json | sha256sum --check --strict
          python - <<'PY'
          import hashlib, json, pathlib, stat
          root = pathlib.Path('composition/site')
          expected = json.loads(pathlib.Path('composition/.docs-deployment.json').read_text())['files']
          actual = {}
          for path in root.rglob('*'):
              info = path.lstat()
              if path.is_symlink():
                  raise SystemExit('Deployment contains a link')
              if stat.S_ISREG(info.st_mode):
                  if info.st_nlink != 1 or info.st_size > 67108864:
                      raise SystemExit('Deployment contains an invalid file')
                  actual[path.relative_to(root).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
              elif not stat.S_ISDIR(info.st_mode):
                  raise SystemExit('Deployment contains a nonregular entry')
          if actual != expected:
              raise SystemExit('Deployment inventory mismatch')
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/dev" --jq .commit.sha)" = "$DEV_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$STABLE_TAG"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: composition/site
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: authority
        with:
          app-id: ${{ secrets.RELEASE_CONTROL_APP_ID }}
          private-key: ${{ secrets.RELEASE_CONTROL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-actions: read
          permission-issues: read
          permission-pull-requests: read
          permission-administration: read
          permission-environments: read
          permission-secrets: read
      - name: Recheck requester and resumer after the deployment queue and upload
        id: authorized
        env:
          GH_TOKEN: ${{ steps.authority.outputs.token }}
          EXPECTED_MANIFEST: ${{ needs.compose.outputs.manifest_sha256 }}
          DEV_SHA: ${{ needs.register.outputs.dev_sha }}
          STABLE_TAG: ${{ needs.register.outputs.stable_tag }}
        run: |
          set -euo pipefail
          test "$(sha256sum composition/.docs-deployment.json | cut -d' ' -f1)" = "$EXPECTED_MANIFEST"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/dev" --jq .commit.sha)" = "$DEV_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$STABLE_TAG"
          # Human authorization must follow every external freshness read.
          packages/cg-release/.venv/bin/python -I -m cg_release.profile_worker authorize-deploy --request-id "$REQUEST_ID" --nonce "$NONCE"
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
