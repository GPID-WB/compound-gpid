# Disabled generic template. Install as .github/workflows/release-controller-build.yml
# through a reviewed setup PR. Declare its build check with stage: release in policy.
# Also declare ordinary PR CI with stage: preparation-and-release. Both are final gates.
# Configure the reviewed public controller repository/revision/wheel URL/digest vars.
name: Release controller build
on:
  workflow_dispatch:
    inputs:
      build_request:
        required: true
        type: string
      dispatch_nonce:
        required: true
        type: string
permissions:
  contents: read
jobs:
  register:
    concurrency:
      group: release-controller-control
      cancel-in-progress: false
    if: ${{ false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release-control
    outputs:
      source_sha: ${{ steps.register.outputs.source_sha }}
      build_spec: ${{ steps.register.outputs.build_spec }}
      controller_revision: ${{ steps.register.outputs.controller_revision }}
      wheel_digest: ${{ steps.register.outputs.wheel_digest }}
    env:
      CG_RELEASE_CONTROLLER_REVISION: ${{ vars.CG_RELEASE_CONTROLLER_REVISION }}
      CG_RELEASE_WHEEL_SHA256: ${{ vars.CG_RELEASE_WHEEL_SHA256 }}
      CONTROLLER_WHEEL_URL: ${{ vars.CG_RELEASE_CONTROLLER_WHEEL_URL }}
      BUILD_REQUEST: ${{ inputs.build_request }}
      DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
    steps:
      - name: Require reviewed installation pins
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CG_RELEASE_CONTROLLER_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CG_RELEASE_WHEEL_SHA256" =~ ^[0-9a-f]{64}$ ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ vars.CG_RELEASE_CONTROLLER_REPOSITORY }}
          ref: ${{ env.CG_RELEASE_CONTROLLER_REVISION }}
          persist-credentials: false
          path: _controller
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install independently pinned controller
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install uv==0.11.3
          uv sync --project _controller/packages/cg-release --python 3.12 --locked --no-install-project
          curl --fail --proto '=https' --tlsv1.2 "$CONTROLLER_WHEEL_URL" -o cg_release-0.1.0-py3-none-any.whl
          printf '%s  %s\n' "$CG_RELEASE_WHEEL_SHA256" cg_release-0.1.0-py3-none-any.whl | sha256sum --check --strict
          uv pip install --link-mode copy --python _controller/packages/cg-release/.venv/bin/python --no-deps cg_release-0.1.0-py3-none-any.whl
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app
        with:
          app-id: ${{ secrets.RELEASE_CONTROL_APP_ID }}
          private-key: ${{ secrets.RELEASE_CONTROL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: read
          permission-pull-requests: read
          permission-actions: read
          permission-administration: read
          permission-environments: read
          permission-secrets: read
      - name: Register exact run before source execution
        id: register
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        shell: bash
        run: |
          _controller/packages/cg-release/.venv/bin/python -I -m cg_release.build_worker register \
            --request-id "$BUILD_REQUEST" --nonce "$DISPATCH_NONCE"
  build:
    name: build
    needs: register
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CG_RELEASE_SOURCE_JOB: 'true'
      CG_RELEASE_SOURCE_SHA: ${{ needs.register.outputs.source_sha }}
      CG_RELEASE_BUILD_SPEC: ${{ needs.register.outputs.build_spec }}
      CG_RELEASE_WHEEL_SHA256: ${{ needs.register.outputs.wheel_digest }}
      CONTROLLER_WHEEL_URL: ${{ vars.CG_RELEASE_CONTROLLER_WHEEL_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.register.outputs.source_sha }}
          persist-credentials: false
          path: source
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ vars.CG_RELEASE_CONTROLLER_REPOSITORY }}
          ref: ${{ needs.register.outputs.controller_revision }}
          persist-credentials: false
          path: _controller
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install source-job helper at the registered pin
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install uv==0.11.3
          uv sync --project _controller/packages/cg-release --python 3.12 --locked --no-install-project
          curl --fail --proto '=https' --tlsv1.2 "$CONTROLLER_WHEEL_URL" -o cg_release-0.1.0-py3-none-any.whl
          printf '%s  %s\n' "$CG_RELEASE_WHEEL_SHA256" cg_release-0.1.0-py3-none-any.whl | sha256sum --check --strict
          uv pip install --link-mode copy --python _controller/packages/cg-release/.venv/bin/python --no-deps cg_release-0.1.0-py3-none-any.whl
      - name: Execute policy argv in the source-only job
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/_controller/packages/cg-release/.venv/bin:$PATH"
          python -I -m cg_release.build_worker build --source "$GITHUB_WORKSPACE/source" --output "$RUNNER_TEMP/release-assets"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 7
