[project]
name = "cg-release"
version = "0.1.0"
description = "Deterministic release controller contracts (publication disabled)"
requires-python = ">=3.11"
dependencies = [
    "semver>=3.0.4,<4",
    "pydantic>=2.10,<3",
    "loguru>=0.7,<1",
    "tomlkit>=0.13,<1",
    "packaging>=24,<27",
]

[project.scripts]
cg-release = "cg_release.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "build>=1.2,<2",
    "hatchling>=1.27,<2",
    "PyYAML==6.0.2",
]
gpid-native = ["PyYAML==6.0.2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cg_release"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
