name: Build release documentation

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out immutable tag commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"

      - name: Validate tag, lineage, and durable payload
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          required_branch="main"
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            required_branch="dev"
          elif [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG"
            exit 1
          fi
          git fetch origin "$required_branch" "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" "origin/$required_branch"
          node scripts/generate-whats-new.js --validate-payload "releases/$RELEASE_TAG.json"
          node scripts/generate-whats-new.js --validate-release-set
          cmp -s "releases/$RELEASE_TAG.json" releases/latest.json
          echo "RELEASE_BRANCH=$required_branch" >> "$GITHUB_ENV"

      - name: Check out current dev source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: dev
          path: current-dev
          fetch-depth: 0

      - name: Build complete documentation tree
        run: node scripts/rebuild-docs.js --all

      - name: Build current dev documentation tree
        run: node current-dev/scripts/rebuild-docs.js --root "$GITHUB_WORKSPACE/current-dev" --all

      - name: Validate tagged documentation site
        run: node scripts/check-docs-site.js

      - name: Validate current dev documentation site
        run: node current-dev/scripts/check-docs-site.js --source-root "$GITHUB_WORKSPACE/current-dev" --docs-root "$GITHUB_WORKSPACE/current-dev/docs"

      - name: Assemble complete release and dev documentation artifact
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          dev_sha="$(git -C current-dev rev-parse HEAD)"
          node scripts/assemble-docs-site.js \
            --main-root "$GITHUB_WORKSPACE" \
            --dev-root "$GITHUB_WORKSPACE/current-dev" \
            --out "$GITHUB_WORKSPACE/combined-artifact" \
            --main-sha "$RELEASE_SHA" \
            --dev-sha "$dev_sha" \
            --main-branch "$RELEASE_BRANCH" \
            --dev-branch dev \
            --main-ref "$RELEASE_TAG" \
            --dev-ref dev

          - name: Require combined release metadata
            run: test -f combined-artifact/.docs-build-metadata.json

      - name: Upload combined release documentation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-docs-site
          path: |
            combined-artifact/
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
