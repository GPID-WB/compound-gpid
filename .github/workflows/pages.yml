name: Deploy documentation site
# Created 2026-09-10.

on:
  push:
    branches: [dev]
    paths:
      - '.github/prompts/**'
      - '.github/skills/**'
      - '.github/agents/**'
      - 'docs/**'
      - 'scripts/rebuild-docs.js'
      - 'scripts/docs-*.js'
      - 'scripts/docs-legacy-v1/**'
      - '.github/shared/module-registry.json'
      - '.github/shared/help-catalog.json'
      - '.github/shared/shell-commands.json'
      - 'scripts/check-docs-site.js'
      - 'scripts/assemble-docs-site.js'
      - '.github/workflows/docs-site-build.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-dev-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out exact unprivileged dev source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"

      - name: Build and validate development documentation source
        if: github.ref == 'refs/heads/dev'
        run: |
          node scripts/rebuild-docs.js --all
          node scripts/check-docs-site.js

      # The protected workflow_run controller composes this artifact as static data.
      - name: Upload exact-run development documentation
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-dev-docs
          path: |
            docs/
            .docs-build-metadata.json
          include-hidden-files: true
          if-no-files-found: error
