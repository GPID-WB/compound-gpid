name: Deploy documentation site
# Created 2026-09-10.

on:
  push:
    branches: [dev]
    paths:
      - '.github/prompts/**'
      - '.github/skills/**'
      - '.github/agents/**'
      - 'docs/**'
      - 'scripts/rebuild-docs.js'
      - 'scripts/check-docs-site.js'
      - 'scripts/assemble-docs-site.js'
      - '.github/workflows/docs-site-build.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-dev-preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out current dev source and controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: dev
          fetch-depth: 0

      - name: Check out current main source as stable content
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: main
          path: sources/main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"

      - name: Validate stable documentation source
        working-directory: sources/main
        run: node "$GITHUB_WORKSPACE/scripts/check-docs-site.js" --legacy

      - name: Build and validate development documentation source
        run: |
          node scripts/rebuild-docs.js --all
          node scripts/check-docs-site.js

      - name: Assemble combined documentation artifact
        run: |
          main_sha="$(git -C sources/main rev-parse HEAD)"
          dev_sha="$(git rev-parse HEAD)"
          node scripts/assemble-docs-site.js \
            --main-root "$GITHUB_WORKSPACE/sources/main" \
            --dev-root "$GITHUB_WORKSPACE" \
            --out "$GITHUB_WORKSPACE/combined-artifact" \
            --main-sha "$main_sha" \
            --dev-sha "$dev_sha" \
            --main-branch main \
            --dev-branch dev \
            --main-ref main \
            --dev-ref dev

      - name: Verify combined documentation artifact
        run: |
          node scripts/assemble-docs-site.js \
            --verify combined-artifact \
            --main-root "$GITHUB_WORKSPACE/sources/main" \
            --dev-root "$GITHUB_WORKSPACE" \
            --main-branch main \
            --dev-branch dev \
            --main-ref main \
            --dev-ref dev

      - name: Require combined build metadata
        run: test -f combined-artifact/.docs-build-metadata.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: combined-artifact/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
