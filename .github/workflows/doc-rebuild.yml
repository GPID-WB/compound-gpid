name: Rebuild documentation

on:
  push:
    branches: [main]
    paths:
      - '.github/prompts/**'
      - '.github/skills/**'
      - '.github/agents/**'
      - 'docs/**'
      - 'scripts/rebuild-docs.js'
      - 'scripts/generate-whats-new.js'
      - 'scripts/check-docs-site.js'
      - '.github/workflows/doc-rebuild.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/release-docs.yml'
      - '.github/workflows/release-pages.yml'

permissions:
  contents: read

concurrency:
  group: doc-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"

      - name: Build complete documentation tree
        run: node scripts/rebuild-docs.js --all

      - name: Validate documentation site
        run: node scripts/check-docs-site.js

      - name: Check for docs changes
        id: diff
        run: |
          if git diff --quiet -- docs/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit rebuilt docs
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "compound-gpid-docs-bot"
          git config user.email "compound-gpid-docs-bot@users.noreply.github.com"
          git add -- docs/
          unexpected="$(git diff --cached --name-only | grep -Ev '^docs/' || true)"
          if [ -n "$unexpected" ]; then
            echo "Refusing to commit paths outside docs/: $unexpected"
            exit 1
          fi
          git commit -m "docs: deterministic rebuild from approved canonical inputs (automated)"
          git push origin HEAD:refs/heads/main

      - name: Upload complete docs artifact and build metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: docs-site
          path: |
            docs/
            .docs-build-metadata.json
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
