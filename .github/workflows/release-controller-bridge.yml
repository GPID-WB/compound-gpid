# Disabled read-only V6 verifier. This workflow never creates tags or Releases.
# Real identities remain unresolved. A reviewed external operation must authorize
# separate native runs at the published bridge commit. Reader fixtures never qualify.
name: Release controller bridge verification
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        required: true
        options: [windows, unix]
      qualification:
        description: 'Reviewed BridgeSpec JSON with repository and three immutable published distributions'
        type: string
        required: true
permissions:
  contents: read
  actions: read
env:
  CG_BRIDGE_SPEC: ${{ inputs.qualification }}
  CG_BRIDGE_PLATFORM: ${{ inputs.platform }}
jobs:
  windows:
    name: bridge-clean-client-windows
    if: ${{ false && inputs.platform == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.3
      - name: Qualify actual delivered bridge
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --project packages/cg-release --locked --python 3.12 python -m cg_release.bridge_qualifier --authorize-real-bridge --scratch "${{ runner.temp }}/bridge-client" --output qualification.json
      - name: Upload actual bridge qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bridge-clean-client-windows
          path: qualification.json
          if-no-files-found: error
  unix:
    name: bridge-clean-client-unix
    if: ${{ false && inputs.platform == 'unix' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.3
      - name: Qualify actual delivered bridge
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --project packages/cg-release --locked --python 3.12 python -m cg_release.bridge_qualifier --authorize-real-bridge --scratch "${{ runner.temp }}/bridge-client" --output qualification.json
      - name: Upload actual bridge qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bridge-clean-client-unix
          path: qualification.json
          if-no-files-found: error
