name: Pester tests

on:
  push:
    branches: [ main, dev, 'feat/**', 'fix/**', 'chore/**' ]
  pull_request:
    branches: [ main, dev ]

jobs:
  browser-evidence:
    name: Browser evidence manifest tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - name: Install Node test dependencies
        run: npm install
      - name: Run documentation automation tests
        run: npm run test:docs-automation
      - name: Install Chromium for evidence capture
        run: npx playwright install --with-deps chromium
      - name: Capture browser evidence manifest
        run: npm run capture
      - name: Run browser evidence tests
        run: npm test

  native-targets:
    name: Native target Python gate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            backend_marker: backend_windows
          - os: macos-14
            backend_marker: backend_posix
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install Python test dependencies
        run: python -m pip install pytest pyyaml
      - name: Run required native target gate
        run: >-
          python -m pytest
          scripts/tests/test_target_mapping.py
          scripts/tests/test_cg_generate_targets.py
          scripts/tests/test_target_path_safety.py
          scripts/tests/test_target_packaging.py
          scripts/tests/test_target_ownership.py
          scripts/tests/test_target_closure.py
          scripts/tests/test_target_determinism.py
          scripts/tests/test_target_drift.py
          scripts/tests/test_target_claude.py
          scripts/tests/test_target_codex.py
          scripts/tests/test_target_opencode.py
          scripts/tests/test_target_kilo.py
          scripts/tests/test_target_documentation.py
          scripts/tests/test_model_advisory.py
          scripts/tests/test_audit_context.py
          scripts/tests/test_module_registry.py
          scripts/tests/test_context_budget.py
          scripts/tests/test_config_migration.py
          scripts/tests/test_cg_characterization.py
          scripts/tests/test_cr_baseline.py
          scripts/tests/test_issue_readiness.py
          scripts/tests/test_issue_dispatch.py
          scripts/tests/test_frontmatter_parsing.py
          scripts/tests/test_yaml_frontmatter_lint.py
          -q

      - name: Run module registry and cross-suite gate
        run: >-
          python scripts/cg_validate_modules.py --check-dependencies
          && python scripts/cg_validate_modules.py --check-cross-suite
          && python scripts/cg_validate_modules.py --check-ownership

      - name: Run generic publisher and security Python gate
        run: >-
          python -m pytest
          scripts/tests/test_secure_fs.py
          scripts/artifact_views/tests/test_writer.py
          scripts/artifact_views/tests/test_generic_cli.py
          scripts/artifact_views/tests/test_generic_parser.py
          scripts/artifact_views/tests/test_generic_renderer.py
          scripts/artifact_views/tests/test_generic_launchers.py
          scripts/artifact_views/tests/test_publishing.py
          scripts/artifact_views/tests/test_publishing_paths.py
          scripts/artifact_views/tests/test_publishing_provenance.py
          scripts/artifact_views/tests/test_publishing_security.py
          scripts/artifact_views/tests/test_reference_theme.py
          scripts/artifact_views/tests/test_themes.py
          scripts/artifact_views/tests/test_integration.py
          --junitxml=publisher-results.xml
          -q

      - name: Run applicable secure backend race gate
        if: always()
        run: >-
          python -m pytest
          scripts/tests/test_secure_fs.py
          scripts/tests/test_target_ownership.py
          scripts/artifact_views/tests/test_writer.py
          -m "${{ matrix.backend_marker }}"
          --junitxml=publisher-backend-results.xml
          -q

      - name: Require backend race evidence
        if: always()
        run: >-
          python scripts/assert_backend_race_gate.py
          publisher-backend-results.xml
          "${{ matrix.backend_marker }}"

      - name: Upload publisher Python results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: publisher-python-results-${{ matrix.os }}
          path: |
            publisher-results.xml
            publisher-backend-results.xml
          if-no-files-found: ignore

  test:
    name: Pester on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [ windows-2022, macos-14 ]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # -------------------------------------------------------------------
      # Windows: install Pester 4.10.1 via pwsh so both platforms use the
      # same runner. Pester 4.x supports 'Should -Be' dash syntax and
      # single-phase execution (no scope isolation), which is required by
      # tests that set shared variables in Describe/top-level scope.
      # Recent windows-2022 runner images also carry Pester 5 in the global
      # module path which would override the built-in Pester 3.4 — pinning
      # 4.10.1 ensures a deterministic, identical setup to macOS.
      # -------------------------------------------------------------------
      - name: Install Pester 4.10.1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 4.10.1 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run tests (Windows pwsh + Pester 4.10.1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 4.10.1
          . tests/Run-Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # -------------------------------------------------------------------
      # Windows E2E smoke test
      # Verifies that link.ps1 creates junctions in a fresh project dir,
      # is idempotent on a second run, and that unlink.ps1 cleans up.
      # Catches path-separator bugs (e.g., hardcoded backslashes) that
      # pass unit tests but fail against a real directory tree.
      # -------------------------------------------------------------------
      - name: E2E smoke test (Windows)
        if: success() && runner.os == 'Windows'
        shell: pwsh
        run: |
          # Pre-clean any stale e2e-project from a prior run (handles self-hosted
          # runner reuse where $RUNNER_TEMP persists between jobs).
          $e2eDir = "$env:RUNNER_TEMP\e2e-project"
          if (Test-Path $e2eDir) { cmd /c rmdir /s /q "$e2eDir" 2>&1 | Out-Null }
          New-Item -ItemType Directory -Path $e2eDir | Out-Null
          Set-Location $e2eDir
          $env:CG_SKIP_UPDATE = "1"

          # 1. Link (exclude kilo — requires a certified host not available on CI)
          & "$env:GITHUB_WORKSPACE\scripts\link.ps1" -Platforms "copilot,claude-code,codex,opencode"

          # 2. Assert junction and file accessibility
          $junction = Get-Item ".github\prompts" -ErrorAction Stop
          if ($junction.LinkType -ne 'Junction') {
              throw "Expected .github\prompts to be a Junction, got: $($junction.LinkType)"
          }
          if (-not (Test-Path ".github\prompts\cg-setup.prompt.md")) {
            throw "cg-setup.prompt.md not accessible through the junction"
          }
          # Kilo is excluded from CI platforms (certified host unavailable).
          # Compatibility mirrors activate only when .kilo/skills is installed.
          $kiloInstalled = (Test-Path ".kilo\skills\.compound-gpid-managed-copy.json")
          if ($kiloInstalled) {
            if ((Get-Item ".kilo\skills" -Force).LinkType) {
              throw "Expected .kilo/skills to remain a real copy"
            }
            $compatibility = @(
              [pscustomobject]@{ Root = ".claude\skills"; Source = "$env:GITHUB_WORKSPACE\.claude\skills"; Id = "claude-code" },
              [pscustomobject]@{ Root = ".agents\skills"; Source = "$env:GITHUB_WORKSPACE\.agents\skills"; Id = "codex" },
              [pscustomobject]@{ Root = ".opencode\skills"; Source = "$env:GITHUB_WORKSPACE\.opencode\skills"; Id = "opencode" }
            )
            foreach ($adapter in $compatibility) {
              $item = Get-Item $adapter.Root -Force
              $mirror = [System.IO.Path]::GetFullPath((Join-Path $e2eDir ".compound-gpid\kilo-compat-skills\$($adapter.Id)"))
              $actual = [System.IO.Path]::GetFullPath([string]($item.Target -join ''))
              if ($item.LinkType -ne 'Junction' -or $actual -ne $mirror) {
                throw "Expected $($adapter.Root) junction to local mirror; got $actual"
              }
              if (-not (Test-Path (Join-Path $mirror ".compound-gpid-managed-copy.json"))) {
                throw "Expected managed mirror marker for $($adapter.Id)"
              }
            }
            $copyPairs = @(
              [pscustomobject]@{ Source = "$env:GITHUB_WORKSPACE\.kilo\skills"; Target = ".kilo\skills"; SourceRel = ".kilo/skills" }
            ) + @($compatibility | ForEach-Object {
              [pscustomobject]@{ Source = $_.Source; Target = ".compound-gpid\kilo-compat-skills\$($_.Id)"; SourceRel = $_.Root.Replace('\', '/') }
            })
            foreach ($pair in $copyPairs) {
               $sourceRoot = $pair.Source
               $targetRoot = $pair.Target
               $sourceFiles = @(Get-ChildItem -LiteralPath $sourceRoot -File -Recurse)
               $marker = Get-Content -LiteralPath (Join-Path $targetRoot ".compound-gpid-managed-copy.json") -Raw -Encoding UTF8 | ConvertFrom-Json
               if ($marker.schemaVersion -ne 1 -or $marker.source -ne $pair.SourceRel -or @($marker.files.PSObject.Properties).Count -ne $sourceFiles.Count) {
                 throw "Invalid managed-copy marker: $targetRoot"
               }
               foreach ($sourceFile in $sourceFiles) {
                 $relative = $sourceFile.FullName.Substring($sourceRoot.Length).TrimStart('\')
                 $targetFile = Join-Path $targetRoot $relative
                 if (-not (Test-Path -LiteralPath $targetFile -PathType Leaf)) {
                   throw "Managed copy missing file: $targetFile"
                 }
                 if ((Get-FileHash -LiteralPath $sourceFile.FullName -Algorithm SHA256).Hash -ne
                     (Get-FileHash -LiteralPath $targetFile -Algorithm SHA256).Hash) {
                   throw "Managed copy byte mismatch: $targetFile"
                 }
               }
             }
          } else {
            Write-Host "  Kilo not linked (certified host unavailable); skipping mirror assertions" -ForegroundColor DarkGray
          }

          # 3. Idempotency: link a second time - must not error
          & "$env:GITHUB_WORKSPACE\scripts\link.ps1" -Platforms "copilot,claude-code,codex,opencode"

          # 4. Unlink (-Force skips interactive confirmation in CI)
          & "$env:GITHUB_WORKSPACE\scripts\unlink.ps1" -Force

          # 5. Assert clean state: junction removed
          if (Test-Path ".github\prompts") {
              throw "Expected .github\prompts to be removed after unlink, but it still exists"
          }
          foreach ($path in @(".claude\skills", ".agents\skills", ".opencode\skills", ".kilo\skills", ".compound-gpid\kilo-compat-skills")) {
            if (Test-Path -LiteralPath $path) { throw "Managed path remains after unlink: $path" }
          }
          # 6. Assert .gitignore was cleaned up after unlink
          if (Test-Path ".gitignore") {
              $gi = Get-Content ".gitignore" -Raw
              if ($gi -match '\.github/prompts/') {
                  throw "Expected .gitignore to be cleaned up after unlink, but CG entries remain"
              }
          }
          Write-Host "E2E smoke test passed." -ForegroundColor Green
          # link.ps1 may leave $LASTEXITCODE != 0 from internal git auto-update
          # operations (expected in CI detached-HEAD context). All assertions above
          # use throw, so reaching this line means the test passed. Reset explicitly.
          $global:LASTEXITCODE = 0

      - name: E2E smoke test teardown (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          # cmd rmdir /s /q treats directory junctions as atomic entries and does
          # NOT recurse through them into their target directories. This is critical:
          # Remove-Item -Recurse follows surviving junctions and would delete files
          # in GITHUB_WORKSPACE if any junction removal failed during the test.
          $e2eDir = "$env:RUNNER_TEMP\e2e-project"
          if (Test-Path $e2eDir) {
              cmd /c rmdir /s /q "$e2eDir" 2>&1 | Out-Null
          }

      # -------------------------------------------------------------------
      # macOS: pwsh (PowerShell 7) does not ship Pester; install 4.10.1 explicitly.
      # Pin to 4.10.1 for reproducibility; -SkipPublisherCheck avoids cert errors
      # in GitHub Actions sandbox. -Scope CurrentUser avoids sudo.
      # Pester 4.x: supports 'Should -Be' and single-phase execution (no scope
      # isolation), matching the test authoring style used across this suite.
      # -------------------------------------------------------------------
      - name: Install Pester 4.10.1 (macOS)
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          # Ensure PSGallery is available on ephemeral runners before install.
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              Install-Module Pester -RequiredVersion 4.10.1 -Force -SkipPublisherCheck -Scope CurrentUser -ErrorAction Stop
              break
            }
            catch {
              if ($attempt -eq $maxAttempts) {
                throw
              }
              Write-Host "Install-Module failed on attempt $attempt/${maxAttempts}: $($_.Exception.Message)"
            }
          }

      - name: Make bash scripts executable (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x scripts/install.sh scripts/link.sh scripts/unlink.sh scripts/update.sh
          chmod +x bin/cg-link bin/cg-unlink bin/cg-update bin/cg-index

      - name: Run tests (macOS pwsh + Pester 4.10.1)
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 4.10.1
          . tests/Run-Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # -------------------------------------------------------------------
      # macOS E2E smoke test
      # Verifies that link.sh creates symlinks in a fresh project dir,
      # is idempotent on a second run, and that unlink.sh cleans up.
      # Catches BSD-readlink incompatibilities and symlink path bugs.
      # -------------------------------------------------------------------
      - name: E2E smoke test (macOS)
        if: success() && runner.os == 'macOS'
        shell: bash
        run: |
          # Pre-clean any stale e2e-project from a prior run (handles self-hosted
          # runner reuse). rm -rf on macOS does not follow symlinks.
          E2E_DIR="$RUNNER_TEMP/e2e-project"
          rm -rf "$E2E_DIR"
          mkdir -p "$E2E_DIR"
          cd "$E2E_DIR"

          # 1. Link (exclude kilo — requires a certified host not available on CI)
          CG_SKIP_UPDATE=1 bash "$GITHUB_WORKSPACE/scripts/link.sh" --platforms "copilot,claude-code,codex,opencode"

          # 2. Assert symlink and file accessibility
          if [[ ! -L ".github/prompts" ]]; then
              echo "ERROR: Expected .github/prompts to be a symlink" >&2; exit 1
          fi
          if [[ ! -f ".github/prompts/cg-setup.prompt.md" ]]; then
            echo "ERROR: cg-setup.prompt.md not accessible through the symlink" >&2; exit 1
          fi
          # Kilo is excluded from CI platforms (certified host unavailable).
          # Compatibility mirrors activate only when .kilo/skills is installed.
          if [[ -f ".kilo/skills/.compound-gpid-managed-copy.json" ]]; then
            [[ ! -L ".kilo/skills" ]] || { echo "ERROR: Expected .kilo/skills to remain a real copy" >&2; exit 1; }
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); assert d["schemaVersion"] == 1 and d["source"] == sys.argv[2] and d["files"]' ".kilo/skills/.compound-gpid-managed-copy.json" ".kilo/skills"
            for spec in ".claude/skills|.claude/skills|claude-code" ".agents/skills|.agents/skills|codex" ".opencode/skills|.opencode/skills|opencode"; do
              IFS='|' read -r root source id <<< "$spec"
              [[ -L "$root" ]] || { echo "ERROR: Expected $root to remain a symlink" >&2; exit 1; }
              real="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$root")"
              expected="$E2E_DIR/.compound-gpid/kilo-compat-skills/$id"
              [[ "$real" == "$expected" ]] || { echo "ERROR: $root resolves to $real, expected $expected" >&2; exit 1; }
              [[ -f "$expected/.compound-gpid-managed-copy.json" ]] || { echo "ERROR: Missing mirror marker for $id" >&2; exit 1; }
              python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); assert d["schemaVersion"] == 1 and d["source"] == sys.argv[2] and d["files"]' "$expected/.compound-gpid-managed-copy.json" "$source"
              diff -rq -x '.compound-gpid-managed-copy.json' "$GITHUB_WORKSPACE/$source" "$expected"
            done
            diff -rq -x '.compound-gpid-managed-copy.json' "$GITHUB_WORKSPACE/.kilo/skills" ".kilo/skills"
          else
            echo "  Kilo not linked (certified host unavailable); skipping mirror assertions"
          fi

          # Simulate a pre-marker POSIX copy from an older release. Changed
          # managed bytes are backed up, refreshed, and adopted into a marker.
          # This block requires Kilo availability on the CI runner.
          if [[ -f ".kilo/skills/cg-skill-brainstorming/SKILL.md" ]]; then
            legacy_skill=".kilo/skills/cg-skill-brainstorming/SKILL.md"
            rm -f ".kilo/skills/.compound-gpid-managed-copy.json"
            printf 'legacy managed bytes\n' > "$legacy_skill"
            CG_SKIP_UPDATE=1 bash "$GITHUB_WORKSPACE/scripts/link.sh" --platforms kilo --yes
            cmp "$GITHUB_WORKSPACE/.kilo/skills/cg-skill-brainstorming/SKILL.md" "$legacy_skill"
            [[ -f "$legacy_skill.compound-gpid-legacy-backup" ]] || {
              echo "ERROR: Expected backup while adopting legacy POSIX copy" >&2; exit 1;
            }
            python3 -c 'import pathlib,sys; assert pathlib.Path(sys.argv[1]).read_bytes() == b"legacy managed bytes\n"' "$legacy_skill.compound-gpid-legacy-backup"
            [[ -f ".kilo/skills/.compound-gpid-managed-copy.json" ]] || {
              echo "ERROR: Legacy POSIX copy was not adopted into a marker" >&2; exit 1;
            }
            rm -f "$legacy_skill.compound-gpid-legacy-backup"
          else
            echo "  Kilo not linked; skipping legacy migration test"
          fi

          # 3. Idempotency: link a second time - must not error
          CG_SKIP_UPDATE=1 bash "$GITHUB_WORKSPACE/scripts/link.sh" --platforms "copilot,claude-code,codex,opencode"

          # 4. Unlink (--yes skips interactive confirmation in CI)
          bash "$GITHUB_WORKSPACE/scripts/unlink.sh" --yes

          # 5. Assert clean state: symlink removed
          if [[ -e ".github/prompts" ]]; then
              echo "ERROR: Expected .github/prompts to be removed after unlink, but it still exists" >&2; exit 1
          fi
          for path in .claude/skills .agents/skills .opencode/skills .kilo/skills .compound-gpid/kilo-compat-skills; do
            [[ ! -e "$path" && ! -L "$path" ]] || { echo "ERROR: Managed path remains after unlink: $path" >&2; exit 1; }
          done
          # 6. Assert .gitignore was cleaned up after unlink
          if [[ -f ".gitignore" ]] && grep -q '\.github/prompts/' ".gitignore"; then
              echo "ERROR: .gitignore CG entries not cleaned after unlink" >&2; exit 1
          fi

          # Replacement failure must leave the original adapter symlink intact.
          REPLACE_FAIL_DIR="$RUNNER_TEMP/e2e-replace-failure"
          rm -rf "$REPLACE_FAIL_DIR"
          mkdir -p "$REPLACE_FAIL_DIR"
          cd "$REPLACE_FAIL_DIR"
          CG_SKIP_UPDATE=1 bash "$GITHUB_WORKSPACE/scripts/link.sh" --platforms codex --yes
          original_target="$(readlink .agents/skills)"
          chflags -h uchg .agents/skills
          set +e
          CG_SKIP_UPDATE=1 bash "$GITHUB_WORKSPACE/scripts/link.sh" --platforms kilo --yes >"$RUNNER_TEMP/e2e-replace-failure.log" 2>&1
          replace_status=$?
          set -e
          chflags -h nouchg .agents/skills
          [[ "$replace_status" -ne 0 ]] || { echo "ERROR: Injected symlink replacement failure reported success" >&2; exit 1; }
          [[ "$(readlink .agents/skills)" == "$original_target" ]] || { echo "ERROR: Original adapter symlink was not preserved" >&2; exit 1; }
          bash "$GITHUB_WORKSPACE/scripts/unlink.sh" --yes

          # Managed-copy helper failure must propagate as a nonzero link result.
          HELPER_FAIL_DIR="$RUNNER_TEMP/e2e-helper-failure"
          rm -rf "$HELPER_FAIL_DIR"
          mkdir -p "$HELPER_FAIL_DIR"
          cd "$HELPER_FAIL_DIR"
          CG_SKIP_UPDATE=1 bash "$GITHUB_WORKSPACE/scripts/link.sh" --platforms codex --yes
          helper_original="$(readlink .agents/skills)"
          chmod 000 "$GITHUB_WORKSPACE/.agents/skills"
          set +e
          CG_SKIP_UPDATE=1 bash "$GITHUB_WORKSPACE/scripts/link.sh" --platforms kilo --yes >"$RUNNER_TEMP/e2e-helper-failure.log" 2>&1
          helper_status=$?
          set -e
          chmod 755 "$GITHUB_WORKSPACE/.agents/skills"
          [[ "$helper_status" -ne 0 ]] || { echo "ERROR: Managed-copy helper failure reported success" >&2; exit 1; }
          [[ "$(readlink .agents/skills)" == "$helper_original" ]] || { echo "ERROR: Helper failure replaced the adapter symlink" >&2; exit 1; }
          bash "$GITHUB_WORKSPACE/scripts/unlink.sh" --yes
          echo "E2E smoke test passed."

      - name: E2E smoke test teardown (macOS)
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          # On macOS, rm -rf does not follow symlinks — safe to call directly.
          rm -rf "$RUNNER_TEMP/e2e-project" || true
          rm -rf "$RUNNER_TEMP/e2e-replace-failure" "$RUNNER_TEMP/e2e-helper-failure" || true

      # -------------------------------------------------------------------
      # Upload the test result artifact for diagnostics.
      # -------------------------------------------------------------------
      - name: Upload test result artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: test-results-${{ matrix.os }}
          path: tests/last-run.json
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # Docs staleness check
  # Non-blocking: emits a ::warning annotation when scripts/ changes are not
  # accompanied by any docs/ change. Reviewers see the annotation in the PR
  # checks summary. Does not fail the build.
  #
  # Requires full history (fetch-depth: 0): git diff origin/$base...HEAD needs
  # the common ancestor commit reachable from both refs; a shallow clone omits
  # it and produces an empty diff.
  # -------------------------------------------------------------------------
  docs-staleness:
    name: Docs staleness check
    runs-on: ubuntu-latest
    # Only meaningful on pull requests (no base branch to diff against on push)
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # Full history needed for accurate diff against base

      - name: Check for docs updates when scripts change
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.base_ref }}
        run: |
          CHANGED=$(git diff --name-only "origin/${DEFAULT_BRANCH}...HEAD" 2>/dev/null || true)

          echo "Changed files:"
          echo "$CHANGED"

          SCRIPTS_CHANGED=$(echo "$CHANGED" | grep -c '^scripts/' || true)
          DOCS_CHANGED=$(echo   "$CHANGED" | grep -c '^docs/'    || true)
          README_CHANGED=$(echo "$CHANGED" | grep -c '^README'   || true)

          if [[ "$SCRIPTS_CHANGED" -gt 0 && "$DOCS_CHANGED" -eq 0 && "$README_CHANGED" -eq 0 ]]; then
              echo "::warning::$SCRIPTS_CHANGED file(s) in scripts/ changed but no docs/ or README were updated. If the change affects user-facing behavior, flags, or error messages, please update the relevant docs (docs/installation.md, docs/manual.md, or README.md)."
          else
              echo "Docs staleness check passed."
          fi
