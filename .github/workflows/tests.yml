name: Pester tests

on:
  push:
    branches: [ main, dev, 'feat/**', 'fix/**', 'chore/**' ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

# Native target coverage is owned by scripts/cg_pr_preflight.py, not by a
# second workflow list.

jobs:
  browser-evidence:
    name: Browser evidence manifest tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - name: Install Node test dependencies
        run: npm install
      - name: Run documentation automation tests
        run: npm run test:docs-automation
      - name: Install Chromium for evidence capture
        run: npx playwright install --with-deps chromium
      - name: Capture browser evidence manifest
        run: npm run capture
      - name: Run browser evidence tests
        run: npm test

  kilo-capability-report:
    name: Generic Kilo capability report
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.capability.outputs.outcome }}
    steps:
      - name: Record generic Kilo capability
        id: capability
        shell: bash
        env:
          CG_KILO_CERTIFIED_RUNNER: ${{ vars.CG_KILO_CERTIFIED_RUNNER }}
          CG_KILO_CERTIFIED_VERSION: ${{ vars.CG_KILO_CERTIFIED_VERSION }}
          CG_KILO_CERTIFIED_SHA256: ${{ vars.CG_KILO_CERTIFIED_SHA256 }}
        run: |
          set -euo pipefail
          configured=true
          if [[ -z "$CG_KILO_CERTIFIED_RUNNER" || \
                -z "$CG_KILO_CERTIFIED_VERSION" || \
                -z "$CG_KILO_CERTIFIED_SHA256" ]]; then
            configured=false
          fi

          if [[ "$configured" == true ]]; then
            cat > kilo-capability.json <<'JSON'
          {"outcome":"generic-not-applicable","certified_configuration_present":true,"generic_ci_real_host_integration":false,"message":"Certified-host configuration is present, but generic CI did not run real-host integration."}
          JSON
          else
            cat > kilo-capability.json <<'JSON'
          {"outcome":"generic-not-applicable","certified_configuration_present":false,"generic_ci_real_host_integration":false,"message":"Certified-host runner, version, or SHA-256 configuration is absent; generic CI did not run real-host integration."}
          JSON
          fi

          printf 'outcome=generic-not-applicable\n' >> "$GITHUB_OUTPUT"
          {
            echo "### Kilo capability"
            echo "- Outcome: \`generic-not-applicable\`"
            echo "- Certified-host configuration present: \`$configured\`"
            echo "- Generic CI did not run real-host integration."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded Kilo capability summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: kilo-capability-summary
          path: kilo-capability.json
          if-no-files-found: error

  kilo-certified-integration:
    name: Certified Kilo host integration
    if: >-
      ${{
        github.event_name != 'pull_request' &&
        vars.CG_KILO_CERTIFIED_RUNNER != '' &&
        vars.CG_KILO_CERTIFIED_VERSION != '' &&
        vars.CG_KILO_CERTIFIED_SHA256 != '' &&
        (
          (github.event_name == 'push' &&
           github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
          (github.event_name == 'workflow_dispatch' &&
           github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
           github.event.ref == github.event.repository.default_branch)
        )
      }}
    runs-on: ${{ vars.CG_KILO_CERTIFIED_RUNNER }}
    timeout-minutes: 30
    environment: cg-kilo-certified
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install certified-host test dependency
        run: python -m pip install pytest

      - name: Run certified-host Kilo preflight
        shell: bash
        run: |
          set +e
          python scripts/cg_kilo_preflight.py --host-only --json > kilo-preflight.json 2> kilo-preflight.stderr
          preflight_exit=$?
          set -e
          printf '%s\n' "$preflight_exit" > kilo-preflight.exit
          if [[ "$preflight_exit" -ne 0 ]]; then
            echo "::error title=certified-host::Kilo preflight exited with status $preflight_exit."
          fi
          exit 0

      - name: Verify certified-host Kilo evidence
        shell: bash
        env:
          CG_KILO_CERTIFIED_VERSION: ${{ vars.CG_KILO_CERTIFIED_VERSION }}
          CG_KILO_CERTIFIED_SHA256: ${{ vars.CG_KILO_CERTIFIED_SHA256 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def fail(message):
              print(f"::error title=certified-host::{message}")
              raise SystemExit(1)

          try:
              payload = json.loads(Path("kilo-preflight.json").read_text(encoding="utf-8"))
              preflight_exit = int(Path("kilo-preflight.exit").read_text(encoding="utf-8").strip())
          except (OSError, ValueError, TypeError, json.JSONDecodeError) as exc:
              fail(f"Kilo preflight evidence is malformed: {exc}")

          if not isinstance(payload, dict):
              fail("Kilo preflight evidence is not a JSON object.")
          if preflight_exit != 0 or payload.get("status") != "ok":
              fail(
                  "Kilo preflight did not report successful certified-host status: "
                  f"status={payload.get('status')!r}, exit_code={preflight_exit}."
              )

          expected_version = os.environ["CG_KILO_CERTIFIED_VERSION"]
          observed_version = payload.get("kilo_version")
          if observed_version != expected_version:
              fail(
                  "Configured Kilo version does not match the observed host: "
                  f"expected={expected_version!r}, observed={observed_version!r}."
              )

          expected_hash = os.environ["CG_KILO_CERTIFIED_SHA256"].casefold()
          observed_hash = payload.get("kilo_executable_sha256")
          if not isinstance(observed_hash, str) or observed_hash.casefold() != expected_hash:
              fail("Configured Kilo executable SHA-256 does not match the observed host.")
          PY

      - name: Launch certified-host cg-kilo (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          chmod +x bin/cg-kilo
          bin/cg-kilo --version > cg-kilo-launch.log 2>&1
          launch_exit=$?
          set -e
          if [[ "$launch_exit" -ne 0 ]]; then
            echo "::error title=certified-host::cg-kilo launch failed with status $launch_exit."
            exit 1
          fi

      - name: Launch certified-host cg-kilo (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE "cg-kilo-launch.log"
          & "$env:GITHUB_WORKSPACE\bin\cg-kilo.cmd" --version *> $log
          $launchExit = $LASTEXITCODE
          if ($launchExit -ne 0) {
            Write-Output "::error title=certified-host::cg-kilo launch failed with status $launchExit."
            exit 1
          }

      - name: Run certified-host Kilo coexistence integration
        shell: bash
        run: |
          set -euo pipefail
          executable="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("kilo-preflight.json").read_text(encoding="utf-8")).get("kilo_executable") or "")')"
          if [[ -z "$executable" ]]; then
            echo "::error title=certified-host::Preflight did not identify the executable used for integration evidence."
            exit 1
          fi
          CG_KILO_CERTIFIED_EXECUTABLE="$executable" \
            python -m pytest scripts/tests/test_kilo_coexistence.py -m integration -q

      - name: Upload certified-host Kilo evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: kilo-certified-evidence
          path: |
            kilo-preflight.json
            kilo-preflight.stderr
            kilo-preflight.exit
            cg-kilo-launch.log
          if-no-files-found: ignore

  native-targets:
    name: Native target Python gate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            backend_marker: backend_windows
          - os: macos-14
            backend_marker: backend_posix
          - os: ubuntu-24.04
            backend_marker: backend_posix
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # The preflight must compare the event's actual base/before revision.
          fetch-depth: 0
          # Migration fixtures read the committed v1.2.0.9021 source.
          fetch-tags: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install Python test dependencies
        run: python -m pip install pytest pyyaml
      - name: Run authoritative native target preflight
        shell: bash
        env:
          CG_EVENT_NAME: ${{ github.event_name }}
          CG_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CG_PUSH_BEFORE_SHA: ${{ github.event.before }}
          CG_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          common=(--phase committed --format text --default-branch "$CG_DEFAULT_BRANCH" --run-native-target)
          if [[ "$CG_EVENT_NAME" == "pull_request" ]]; then
            if [[ -z "$CG_PR_BASE_SHA" ]]; then
              echo "ERROR: pull_request.base.sha was not supplied; refusing to guess a base." >&2
              exit 2
            fi
            python scripts/cg_pr_preflight.py "${common[@]}" --base "$CG_PR_BASE_SHA"
          elif [[ -n "$CG_PUSH_BEFORE_SHA" && "$CG_PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            if git rev-parse --verify --quiet "${CG_PUSH_BEFORE_SHA}^{commit}" >/dev/null; then
              python scripts/cg_pr_preflight.py "${common[@]}" --base "$CG_PUSH_BEFORE_SHA"
            else
              echo "Push-before revision is unavailable; requesting explicit full-gate fallback."
              python scripts/cg_pr_preflight.py "${common[@]}" --full-gate
            fi
          else
            echo "No usable push-before revision; requesting explicit full-gate fallback."
            python scripts/cg_pr_preflight.py "${common[@]}" --full-gate
          fi

      # The preflight owns the former native list, including deterministic
      # test_kilo_coexistence.py, test_kilo_copy.py, and test_cg_pr_preflight.py.
      # It also runs --check-dependencies, --check-cross-suite, and
      # --check-ownership; this comment is not a second executable test list.

      - name: Run generic publisher and security Python gate
        run: >-
          python -m pytest
          scripts/tests/test_secure_fs.py
          scripts/artifact_views/tests/test_writer.py
          scripts/artifact_views/tests/test_generic_cli.py
          scripts/artifact_views/tests/test_generic_parser.py
          scripts/artifact_views/tests/test_generic_renderer.py
          scripts/artifact_views/tests/test_generic_launchers.py
          scripts/artifact_views/tests/test_publishing.py
          scripts/artifact_views/tests/test_publishing_paths.py
          scripts/artifact_views/tests/test_publishing_provenance.py
          scripts/artifact_views/tests/test_publishing_security.py
          scripts/artifact_views/tests/test_reference_theme.py
          scripts/artifact_views/tests/test_themes.py
          scripts/artifact_views/tests/test_integration.py
          --junitxml=publisher-results.xml
          -q

      - name: Run applicable secure backend race gate
        if: always()
        run: >-
          python -m pytest
          scripts/tests/test_secure_fs.py
          scripts/tests/test_target_ownership.py
          scripts/artifact_views/tests/test_writer.py
          -m "${{ matrix.backend_marker }}"
          --junitxml=publisher-backend-results.xml
          -q

      - name: Require backend race evidence
        if: always()
        run: >-
          python scripts/assert_backend_race_gate.py
          publisher-backend-results.xml
          "${{ matrix.backend_marker }}"

      - name: Upload publisher Python results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: publisher-python-results-${{ matrix.os }}
          path: |
            publisher-results.xml
            publisher-backend-results.xml
          if-no-files-found: ignore

  python38-compat:
    name: Python 3.8 skill-management compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.8"
      - name: Install Python 3.8 test dependencies
        run: python -m pip install pytest pyyaml
      - name: Run contracts, planning, registry, admission, generation, and projection tests
        run: >-
          python -m pytest
          scripts/tests/test_skill_management_contracts.py
          scripts/tests/test_skill_management_planning.py
          scripts/tests/test_project_skill_registry.py
          scripts/tests/test_import_skill.py
          scripts/tests/test_cg_generate_targets.py
          scripts/tests/test_project_projection.py
          -q

  test:
    name: Pester on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: kilo-capability-report
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [ windows-2022, macos-14 ]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # -------------------------------------------------------------------
      # Windows: install Pester 4.10.1 via pwsh so both platforms use the
      # same runner. Pester 4.x supports 'Should -Be' dash syntax and
      # single-phase execution (no scope isolation), which is required by
      # tests that set shared variables in Describe/top-level scope.
      # Recent windows-2022 runner images also carry Pester 5 in the global
      # module path which would override the built-in Pester 3.4 — pinning
      # 4.10.1 ensures a deterministic, identical setup to macOS.
      # -------------------------------------------------------------------
      - name: Install Pester 4.10.1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 4.10.1 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run tests (Windows pwsh + Pester 4.10.1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 4.10.1
          . tests/Run-Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # -------------------------------------------------------------------
      # Windows E2E smoke test
      # Verifies that link.ps1 creates junctions in a fresh project dir,
      # is idempotent on a second run, and that unlink.ps1 cleans up.
      # Catches path-separator bugs (e.g., hardcoded backslashes) that
      # pass unit tests but fail against a real directory tree.
      # -------------------------------------------------------------------
      - name: E2E smoke test (Windows)
        if: success() && runner.os == 'Windows'
        shell: pwsh
        env:
          CG_KILO_CAPABILITY: ${{ needs.kilo-capability-report.outputs.outcome }}
        run: |
          if ($env:CG_KILO_CAPABILITY -ne 'generic-not-applicable') {
            throw "Generic E2E received unexpected Kilo capability: $env:CG_KILO_CAPABILITY"
          }
          Write-Host "Kilo capability: $env:CG_KILO_CAPABILITY (generic CI did not run real-host integration)."

          # Pre-clean any stale e2e-project from a prior run (handles self-hosted
          # runner reuse where $RUNNER_TEMP persists between jobs).
          $e2eDir = "$env:RUNNER_TEMP\e2e-project"
          if (Test-Path $e2eDir) { cmd /c rmdir /s /q "$e2eDir" 2>&1 | Out-Null }
          New-Item -ItemType Directory -Path $e2eDir | Out-Null
          Set-Location $e2eDir
          $env:CG_SKIP_UPDATE = "1"

          # 1. Link only host-independent adapters.
          & "$env:GITHUB_WORKSPACE\scripts\link.ps1" -Platforms "copilot,claude-code,codex,opencode"

          # 2. Assert junction and file accessibility
          $junction = Get-Item ".github\prompts" -ErrorAction Stop
          if ($junction.LinkType -ne 'Junction') {
              throw "Expected .github\prompts to be a Junction, got: $($junction.LinkType)"
          }
          if (-not (Test-Path ".github\prompts\cg-setup.prompt.md")) {
            throw "cg-setup.prompt.md not accessible through the junction"
          }
          # 3. Idempotency: link a second time - must not error
          & "$env:GITHUB_WORKSPACE\scripts\link.ps1" -Platforms "copilot,claude-code,codex,opencode"

          # 4. Unlink (-Force skips interactive confirmation in CI)
          & "$env:GITHUB_WORKSPACE\scripts\unlink.ps1" -Force

          # 5. Assert clean state: junction removed
          if (Test-Path ".github\prompts") {
              throw "Expected .github\prompts to be removed after unlink, but it still exists"
          }
          foreach ($path in @(".claude\skills", ".agents\skills", ".opencode\skills")) {
            if (Test-Path -LiteralPath $path) { throw "Managed path remains after unlink: $path" }
          }
          # 6. Assert .gitignore was cleaned up after unlink
          if (Test-Path ".gitignore") {
              $gi = Get-Content ".gitignore" -Raw
              if ($gi -match '\.github/prompts/') {
                  throw "Expected .gitignore to be cleaned up after unlink, but CG entries remain"
              }
          }
          Write-Host "E2E smoke test passed." -ForegroundColor Green
          # link.ps1 may leave $LASTEXITCODE != 0 from internal git auto-update
          # operations (expected in CI detached-HEAD context). All assertions above
          # use throw, so reaching this line means the test passed. Reset explicitly.
          $global:LASTEXITCODE = 0

      - name: E2E smoke test teardown (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          # cmd rmdir /s /q treats directory junctions as atomic entries and does
          # NOT recurse through them into their target directories. This is critical:
          # Remove-Item -Recurse follows surviving junctions and would delete files
          # in GITHUB_WORKSPACE if any junction removal failed during the test.
          $e2eDir = "$env:RUNNER_TEMP\e2e-project"
          if (Test-Path $e2eDir) {
              cmd /c rmdir /s /q "$e2eDir" 2>&1 | Out-Null
          }

      # -------------------------------------------------------------------
      # macOS: pwsh (PowerShell 7) does not ship Pester; install 4.10.1 explicitly.
      # Pin to 4.10.1 for reproducibility; -SkipPublisherCheck avoids cert errors
      # in GitHub Actions sandbox. -Scope CurrentUser avoids sudo.
      # Pester 4.x: supports 'Should -Be' and single-phase execution (no scope
      # isolation), matching the test authoring style used across this suite.
      # -------------------------------------------------------------------
      - name: Install Pester 4.10.1 (macOS)
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          # Ensure PSGallery is available on ephemeral runners before install.
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              Install-Module Pester -RequiredVersion 4.10.1 -Force -SkipPublisherCheck -Scope CurrentUser -ErrorAction Stop
              break
            }
            catch {
              if ($attempt -eq $maxAttempts) {
                throw
              }
              Write-Host "Install-Module failed on attempt $attempt/${maxAttempts}: $($_.Exception.Message)"
            }
          }

      - name: Make bash scripts executable (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x scripts/install.sh scripts/link.sh scripts/unlink.sh scripts/update.sh
          chmod +x bin/cg-link bin/cg-unlink bin/cg-update bin/cg-index

      - name: Run tests (macOS pwsh + Pester 4.10.1)
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 4.10.1
          . tests/Run-Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # -------------------------------------------------------------------
      # macOS E2E smoke test
      # Verifies that link.sh creates symlinks in a fresh project dir,
      # is idempotent on a second run, and that unlink.sh cleans up.
      # Catches BSD-readlink incompatibilities and symlink path bugs.
      # -------------------------------------------------------------------
      - name: E2E smoke test (macOS)
        if: success() && runner.os == 'macOS'
        shell: bash
        env:
          CG_KILO_CAPABILITY: ${{ needs.kilo-capability-report.outputs.outcome }}
        run: |
          set -euo pipefail
          if [[ "$CG_KILO_CAPABILITY" != "generic-not-applicable" ]]; then
            echo "ERROR: Generic E2E received unexpected Kilo capability: $CG_KILO_CAPABILITY" >&2
            exit 1
          fi
          echo "Kilo capability: $CG_KILO_CAPABILITY (generic CI did not run real-host integration)."

          # Pre-clean any stale e2e-project from a prior run (handles self-hosted
          # runner reuse). rm -rf on macOS does not follow symlinks.
          E2E_DIR="$RUNNER_TEMP/e2e-project"
          rm -rf "$E2E_DIR"
          mkdir -p "$E2E_DIR"
          cd "$E2E_DIR"

          # 1. Link only host-independent adapters.
          CG_SKIP_UPDATE=1 bash "$GITHUB_WORKSPACE/scripts/link.sh" --platforms "copilot,claude-code,codex,opencode"

          # 2. Assert symlink and file accessibility
          if [[ ! -L ".github/prompts" ]]; then
              echo "ERROR: Expected .github/prompts to be a symlink" >&2; exit 1
          fi
          if [[ ! -f ".github/prompts/cg-setup.prompt.md" ]]; then
            echo "ERROR: cg-setup.prompt.md not accessible through the symlink" >&2; exit 1
          fi
          # 3. Idempotency: link a second time - must not error
          CG_SKIP_UPDATE=1 bash "$GITHUB_WORKSPACE/scripts/link.sh" --platforms "copilot,claude-code,codex,opencode"

          # 4. Unlink (--yes skips interactive confirmation in CI)
          bash "$GITHUB_WORKSPACE/scripts/unlink.sh" --yes

          # 5. Assert clean state: symlink removed
          if [[ -e ".github/prompts" ]]; then
              echo "ERROR: Expected .github/prompts to be removed after unlink, but it still exists" >&2; exit 1
          fi
          for path in .claude/skills .agents/skills .opencode/skills; do
            [[ ! -e "$path" && ! -L "$path" ]] || { echo "ERROR: Managed path remains after unlink: $path" >&2; exit 1; }
          done
          # 6. Assert .gitignore was cleaned up after unlink
          if [[ -f ".gitignore" ]] && grep -q '\.github/prompts/' ".gitignore"; then
              echo "ERROR: .gitignore CG entries not cleaned after unlink" >&2; exit 1
          fi

          echo "E2E smoke test passed."

      - name: E2E smoke test teardown (macOS)
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          # On macOS, rm -rf does not follow symlinks — safe to call directly.
          rm -rf "$RUNNER_TEMP/e2e-project" || true

      # -------------------------------------------------------------------
      # Upload the test result artifact for diagnostics.
      # -------------------------------------------------------------------
      - name: Upload test result artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: test-results-${{ matrix.os }}
          path: tests/last-run.json
          if-no-files-found: ignore

  # Separate, non-required contexts. These hosted fixtures do not qualify Kilo
  # or the supported re-clone migration, and do not replace the native gates.
  hosted-smoke-windows:
    name: Reduced hosted smoke on windows-latest (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shell: [ powershell, cmd ]
    env:
      CG_SKIP_UPDATE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_TERMINAL_PROMPT: "0"
      GIT_ALLOW_PROTOCOL: file
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        timeout-minutes: 20
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        timeout-minutes: 20
        with:
          python-version: "3.11"
      - name: Prepare isolated Windows candidate and config fixtures
        shell: powershell
        timeout-minutes: 20
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
            throw "This smoke requires Windows PowerShell 5.1"
          }
          if (-not (Test-Path -LiteralPath $env:RUNNER_TEMP -PathType Container)) { throw "Runner temp is missing" }
          $env:CG_SMOKE_ROOT = Join-Path $env:RUNNER_TEMP "cg-smoke-$([Guid]::NewGuid().ToString('N'))"
          "CG_SMOKE_ROOT=$env:CG_SMOKE_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:HOME = Join-Path $env:CG_SMOKE_ROOT "home"
          $env:USERPROFILE = $env:HOME
          $env:APPDATA = Join-Path $env:HOME "AppData\Roaming"
          $env:LOCALAPPDATA = Join-Path $env:HOME "AppData\Local"
          $env:XDG_CONFIG_HOME = Join-Path $env:HOME ".config"
          $env:TEMP = Join-Path $env:CG_SMOKE_ROOT "temp"
          $env:TMP = $env:TEMP
          $env:GIT_CONFIG_GLOBAL = Join-Path $env:CG_SMOKE_ROOT "gitconfig"
          foreach ($directory in @($env:APPDATA, $env:LOCALAPPDATA, "$env:XDG_CONFIG_HOME\kilo", $env:TEMP,
              "$env:CG_SMOKE_ROOT\hooks", "$env:CG_SMOKE_ROOT\empty-project",
              "$env:CG_SMOKE_ROOT\private-project\.kilo", "$env:CG_SMOKE_ROOT\private-project\.opencode")) {
            New-Item -ItemType Directory -Path $directory -Force | Out-Null
          }
          New-Item -ItemType File -Path $env:GIT_CONFIG_GLOBAL | Out-Null
          Set-Variable -Name HOME -Scope Global -Value $env:HOME -Force
          $global:PROFILE = Join-Path $env:HOME "profile.ps1"
          Set-Content -LiteralPath $PROFILE -Value "# synthetic fixture profile" -Encoding ASCII
          Set-Content -LiteralPath "$env:XDG_CONFIG_HOME\kilo\kilo.jsonc" -Encoding ASCII -Value '{ "fixture": "global-kilo", "permission": { "markdown_source": {} } }'
          Set-Content -LiteralPath "$env:CG_SMOKE_ROOT\private-project\.kilo\kilo.json" -Encoding ASCII -Value '{ "fixture": "private-kilo" }'
          Set-Content -LiteralPath "$env:CG_SMOKE_ROOT\private-project\.opencode\opencode.json" -Encoding ASCII -Value '{ "fixture": "private-opencode" }'
          foreach ($relative in @("home\.config\kilo\kilo.jsonc", "private-project\.kilo\kilo.json", "private-project\.opencode\opencode.json")) {
            $snapshot = Join-Path "$env:CG_SMOKE_ROOT\before" $relative
            New-Item -ItemType Directory -Path (Split-Path $snapshot -Parent) -Force | Out-Null
            Copy-Item -LiteralPath "$env:CG_SMOKE_ROOT\$relative" -Destination $snapshot
          }
          foreach ($name in @("HOME", "USERPROFILE", "APPDATA", "LOCALAPPDATA", "XDG_CONFIG_HOME", "TEMP", "TMP", "GIT_CONFIG_GLOBAL")) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          $candidate = git -C $env:GITHUB_WORKSPACE rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw "Cannot resolve checked-out candidate" }
          $install = Join-Path $env:HOME ".compound-gpid"
          # Match Windows wrapper CRLF and disable hooks without changing user Git config.
          git clone --no-local --no-checkout -c core.autocrlf=true -c "core.hooksPath=$env:CG_SMOKE_ROOT\hooks" $env:GITHUB_WORKSPACE $install
          if ($LASTEXITCODE -ne 0) { throw "Fixture clone failed" }
          git -C $install checkout --detach $candidate
          if ($LASTEXITCODE -ne 0) { throw "Candidate checkout failed" }
          $head = git -C $install rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -ne $candidate) { throw "Fixture is not the exact candidate" }
          $status = @(git -C $install status --porcelain)
          if ($LASTEXITCODE -ne 0 -or $status.Count -ne 0) { throw "Candidate clone is dirty: $status" }

      - name: Install candidate with Windows PowerShell 5.1 and verify HKCU PATH
        shell: powershell
        timeout-minutes: 20
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          # HOME alone does not redirect PowerShell automatic variables. The
          # installer can clean a profile, so redirect both in its own process.
          $installCommand = @'
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Set-Variable -Name HOME -Scope Global -Value $env:HOME -Force
          $global:PROFILE = Join-Path $env:HOME 'profile.ps1'
          & (Join-Path $env:USERPROFILE '.compound-gpid\install.ps1')
          '@
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command $installCommand
          if ($LASTEXITCODE -ne 0) { throw "Installer failed" }
          $install = Join-Path $env:USERPROFILE ".compound-gpid"
          $registeredPath = (Get-ItemProperty -LiteralPath "HKCU:\Environment" -Name Path).Path
          if (($registeredPath -split ";") -notcontains "$install\bin") { throw "Installed bin is missing from HKCU PATH" }
          foreach ($wrapper in @("cg-link.cmd", "cg-unlink.cmd")) {
            if (-not (Test-Path -LiteralPath "$install\bin\$wrapper" -PathType Leaf)) { throw "Installed wrapper is missing: $wrapper" }
          }
          $status = @(git -C $install status --porcelain)
          if ($LASTEXITCODE -ne 0 -or $status.Count -ne 0) { throw "Installer changed the clone: $status" }
          foreach ($relative in @("home\.config\kilo\kilo.jsonc", "private-project\.kilo\kilo.json", "private-project\.opencode\opencode.json")) {
            if ((Get-FileHash -LiteralPath "$env:CG_SMOKE_ROOT\$relative").Hash -ne (Get-FileHash -LiteralPath "$env:CG_SMOKE_ROOT\before\$relative").Hash) {
              throw "Installer changed fixture config bytes: $relative"
            }
          }

      - name: Link through installed wrappers in a new PowerShell process
        if: matrix.shell == 'powershell'
        shell: powershell
        timeout-minutes: 20
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw "Expected PowerShell 5.1" }
          Set-Variable -Name HOME -Scope Global -Value $env:HOME -Force
          $global:PROFILE = Join-Path $env:HOME "profile.ps1"
          foreach ($project in @("empty-project", "private-project")) {
            Set-Location -LiteralPath "$env:CG_SMOKE_ROOT\$project"
            & "$env:USERPROFILE\.compound-gpid\bin\cg-link.cmd" --platforms "copilot,claude-code,codex,opencode"
            if ($LASTEXITCODE -ne 0) { throw "cg-link failed: $project" }
          }

      - name: Link through installed wrappers in a new CMD process
        if: matrix.shell == 'cmd'
        shell: cmd
        timeout-minutes: 20
        run: |
          @echo off
          for %%P in (empty-project private-project) do (
            cd /d "%CG_SMOKE_ROOT%\%%P"
            if errorlevel 1 exit /b 1
            call "%USERPROFILE%\.compound-gpid\bin\cg-link.cmd" --platforms copilot,claude-code,codex,opencode
            if errorlevel 1 exit /b 1
          )

      - name: Verify Windows linked fixture config bytes
        shell: powershell
        timeout-minutes: 20
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          foreach ($relative in @("home\.config\kilo\kilo.jsonc", "private-project\.kilo\kilo.json", "private-project\.opencode\opencode.json")) {
            if ((Get-FileHash -LiteralPath "$env:CG_SMOKE_ROOT\$relative").Hash -ne (Get-FileHash -LiteralPath "$env:CG_SMOKE_ROOT\before\$relative").Hash) { throw "cg-link changed fixture config bytes: $relative" }
          }

      - name: Unlink through installed wrappers in a new PowerShell process
        if: matrix.shell == 'powershell'
        shell: powershell
        timeout-minutes: 20
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          Set-Variable -Name HOME -Scope Global -Value $env:HOME -Force
          $global:PROFILE = Join-Path $env:HOME "profile.ps1"
          foreach ($project in @("empty-project", "private-project")) {
            Set-Location -LiteralPath "$env:CG_SMOKE_ROOT\$project"
            & "$env:USERPROFILE\.compound-gpid\bin\cg-unlink.cmd" --yes
            if ($LASTEXITCODE -ne 0) { throw "cg-unlink failed: $project" }
          }

      - name: Unlink through installed wrappers in a new CMD process
        if: matrix.shell == 'cmd'
        shell: cmd
        timeout-minutes: 20
        run: |
          @echo off
          for %%P in (empty-project private-project) do (
            cd /d "%CG_SMOKE_ROOT%\%%P"
            if errorlevel 1 exit /b 1
            call "%USERPROFILE%\.compound-gpid\bin\cg-unlink.cmd" --yes
            if errorlevel 1 exit /b 1
          )

      - name: Verify Windows cleanup, clean clone and unchanged config bytes
        shell: powershell
        timeout-minutes: 20
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          if (@(Get-ChildItem -LiteralPath "$env:CG_SMOKE_ROOT\empty-project" -Force).Count -ne 0) { throw "Empty project was not cleaned" }
          foreach ($relative in @(".github", ".claude", ".agents", ".compound-gpid", ".gitignore")) {
            if (Test-Path -LiteralPath "$env:CG_SMOKE_ROOT\private-project\$relative") { throw "Managed path remains: $relative" }
          }
          foreach ($relative in @(".kilo", ".opencode")) {
            if (@(Get-ChildItem -LiteralPath "$env:CG_SMOKE_ROOT\private-project\$relative" -Force).Count -ne 1) { throw "Unexpected private adapter files remain: $relative" }
          }
          foreach ($relative in @("home\.config\kilo\kilo.jsonc", "private-project\.kilo\kilo.json", "private-project\.opencode\opencode.json")) {
            if ((Get-FileHash -LiteralPath "$env:CG_SMOKE_ROOT\$relative").Hash -ne (Get-FileHash -LiteralPath "$env:CG_SMOKE_ROOT\before\$relative").Hash) { throw "cg-unlink changed fixture config bytes: $relative" }
          }
          $status = @(git -C "$env:USERPROFILE\.compound-gpid" status --porcelain)
          if ($LASTEXITCODE -ne 0 -or $status.Count -ne 0) { throw "Installed clone is dirty: $status" }

      - name: Remove disposable Windows fixtures
        if: always()
        shell: powershell
        timeout-minutes: 20
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          # rmdir removes junction entries without traversing their targets.
          if ($env:CG_SMOKE_ROOT -and (Test-Path -LiteralPath $env:CG_SMOKE_ROOT)) {
            Set-Location -LiteralPath $env:RUNNER_TEMP
            cmd.exe /d /c "rmdir /s /q `"$env:CG_SMOKE_ROOT`""
            if ($LASTEXITCODE -ne 0) { throw "Fixture cleanup failed" }
          }

  hosted-smoke-macos:
    name: Reduced hosted smoke on macos-latest (${{ matrix.shell }})
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shell: [ bash, zsh ]
    env:
      CG_SKIP_UPDATE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_TERMINAL_PROMPT: "0"
      GIT_ALLOW_PROTOCOL: file
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        timeout-minutes: 20
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        timeout-minutes: 20
        with:
          python-version: "3.11"
      - name: Prepare isolated macOS candidate, install and verify shell PATH
        shell: bash
        timeout-minutes: 20
        env:
          SMOKE_SHELL: ${{ matrix.shell }}
        run: |
          set -euo pipefail
          CG_SMOKE_ROOT="$(mktemp -d "$RUNNER_TEMP/cg-smoke-XXXXXX")"
          printf 'CG_SMOKE_ROOT=%s\n' "$CG_SMOKE_ROOT" >> "$GITHUB_ENV"
          export CG_SMOKE_ROOT HOME="$CG_SMOKE_ROOT/home"
          export USERPROFILE="$HOME" APPDATA="$HOME/AppData/Roaming" LOCALAPPDATA="$HOME/AppData/Local"
          export XDG_CONFIG_HOME="$HOME/.config" ZDOTDIR="$HOME" SHELL="/bin/$SMOKE_SHELL"
          export TMPDIR="$CG_SMOKE_ROOT/temp" TEMP="$CG_SMOKE_ROOT/temp" TMP="$CG_SMOKE_ROOT/temp"
          export GIT_CONFIG_GLOBAL="$CG_SMOKE_ROOT/gitconfig"
          mkdir -p "$APPDATA" "$LOCALAPPDATA" "$XDG_CONFIG_HOME/kilo" "$TMPDIR" "$CG_SMOKE_ROOT/hooks" \
            "$CG_SMOKE_ROOT/empty-project" "$CG_SMOKE_ROOT/private-project/.kilo" "$CG_SMOKE_ROOT/private-project/.opencode"
          : > "$GIT_CONFIG_GLOBAL"
          printf '# synthetic fixture profile\n' > "$HOME/.${SMOKE_SHELL}rc"
          printf '{ "fixture": "global-kilo", "permission": { "markdown_source": {} } }\n' > "$XDG_CONFIG_HOME/kilo/kilo.jsonc"
          printf '{ "fixture": "private-kilo" }\n' > "$CG_SMOKE_ROOT/private-project/.kilo/kilo.json"
          printf '{ "fixture": "private-opencode" }\n' > "$CG_SMOKE_ROOT/private-project/.opencode/opencode.json"
          for relative in home/.config/kilo/kilo.jsonc private-project/.kilo/kilo.json private-project/.opencode/opencode.json; do
            mkdir -p "$(dirname "$CG_SMOKE_ROOT/before/$relative")"
            cp "$CG_SMOKE_ROOT/$relative" "$CG_SMOKE_ROOT/before/$relative"
          done
          for variable in HOME USERPROFILE APPDATA LOCALAPPDATA XDG_CONFIG_HOME ZDOTDIR SHELL TMPDIR TEMP TMP GIT_CONFIG_GLOBAL; do
            printf '%s=%s\n' "$variable" "${!variable}" >> "$GITHUB_ENV"
          done
          candidate="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          install="$HOME/.compound-gpid"
          git clone --no-local --no-checkout -c core.autocrlf=false -c "core.hooksPath=$CG_SMOKE_ROOT/hooks" "$GITHUB_WORKSPACE" "$install"
          git -C "$install" checkout --detach "$candidate"
          test "$(git -C "$install" rev-parse HEAD)" = "$candidate"
          clone_status="$(git -C "$install" status --porcelain)"
          test -z "$clone_status"
          bash "$install/scripts/install.sh"
          # Check the registration written for the actual row shell, not just
          # inherited runner PATH. Do not source Bash wrappers with zsh.
          grep -F '# --- Compound GPID ---' "$HOME/.${SMOKE_SHELL}rc"
          grep -F 'export PATH="$HOME/.compound-gpid/bin:$PATH"' "$HOME/.${SMOKE_SHELL}rc"
          clone_status="$(git -C "$install" status --porcelain)"
          test -z "$clone_status"
          for relative in home/.config/kilo/kilo.jsonc private-project/.kilo/kilo.json private-project/.opencode/opencode.json; do
            cmp "$CG_SMOKE_ROOT/$relative" "$CG_SMOKE_ROOT/before/$relative"
          done

      - name: Run installed wrappers in a new bash or zsh process
        shell: ${{ matrix.shell }} -e {0}
        timeout-minutes: 20
        run: |
          set -euo pipefail
          . "$HOME/.$(basename "$SHELL")rc"
          test "$(command -v cg-link)" = "$HOME/.compound-gpid/bin/cg-link"
          test "$(command -v cg-unlink)" = "$HOME/.compound-gpid/bin/cg-unlink"
          for project in empty-project private-project; do
            cd "$CG_SMOKE_ROOT/$project"
            "$HOME/.compound-gpid/bin/cg-link" --platforms copilot,claude-code,codex,opencode
            for relative in home/.config/kilo/kilo.jsonc private-project/.kilo/kilo.json private-project/.opencode/opencode.json; do
              cmp "$CG_SMOKE_ROOT/$relative" "$CG_SMOKE_ROOT/before/$relative"
            done
            "$HOME/.compound-gpid/bin/cg-unlink" --yes
            for relative in .github .claude .agents .compound-gpid .gitignore; do
              test ! -e "$relative"
              test ! -L "$relative"
            done
            if test "$project" = empty-project; then
              test -z "$(ls -A)"
            else
              test "$(ls -A .kilo)" = kilo.json
              test "$(ls -A .opencode)" = opencode.json
            fi
            for relative in home/.config/kilo/kilo.jsonc private-project/.kilo/kilo.json private-project/.opencode/opencode.json; do
              cmp "$CG_SMOKE_ROOT/$relative" "$CG_SMOKE_ROOT/before/$relative"
            done
            clone_status="$(git -C "$HOME/.compound-gpid" status --porcelain)"
            test -z "$clone_status"
          done

      - name: Remove disposable macOS fixtures
        if: always()
        shell: bash
        timeout-minutes: 20
        run: |
          if [[ -n "${CG_SMOKE_ROOT:-}" ]]; then
            rm -rf "$CG_SMOKE_ROOT"
          fi

  # -------------------------------------------------------------------------
  # Docs staleness check
  # Non-blocking: emits a ::warning annotation when scripts/ changes are not
  # accompanied by any docs/ change. Reviewers see the annotation in the PR
  # checks summary. Does not fail the build.
  #
  # Requires full history (fetch-depth: 0): git diff origin/$base...HEAD needs
  # the common ancestor commit reachable from both refs; a shallow clone omits
  # it and produces an empty diff.
  # -------------------------------------------------------------------------
  docs-staleness:
    name: Docs staleness check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only meaningful on pull requests (no base branch to diff against on push)
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # Full history needed for accurate diff against base

      - name: Check for docs updates when scripts change
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.base_ref }}
        run: |
          CHANGED=$(git diff --name-only "origin/${DEFAULT_BRANCH}...HEAD" 2>/dev/null || true)

          echo "Changed files:"
          echo "$CHANGED"

          SCRIPTS_CHANGED=$(echo "$CHANGED" | grep -c '^scripts/' || true)
          DOCS_CHANGED=$(echo   "$CHANGED" | grep -c '^docs/'    || true)
          README_CHANGED=$(echo "$CHANGED" | grep -c '^README'   || true)

          if [[ "$SCRIPTS_CHANGED" -gt 0 && "$DOCS_CHANGED" -eq 0 && "$README_CHANGED" -eq 0 ]]; then
              echo "::warning::$SCRIPTS_CHANGED file(s) in scripts/ changed but no docs/ or README were updated. If the change affects user-facing behavior, flags, or error messages, please update the relevant docs (docs/installation.md, docs/manual.md, or README.md)."
          else
              echo "Docs staleness check passed."
          fi
