name: Build combined documentation
# Pull requests validate the source without receiving publication credentials.
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out proposed documentation source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - name: Build and validate the complete documentation tree
        run: npm run docs:build
      - name: Test navigation, search, and publication contracts
        run: npm run docs:test
      - name: Check out protected publisher verification code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: main
          path: .docs-controller
          persist-credentials: false
      - name: Verify compatibility with the live protected publisher
        run: |
          mkdir -p "$RUNNER_TEMP/docs-check-artifact"
          cp -R docs "$RUNNER_TEMP/docs-check-artifact/docs"
          cp .docs-build-metadata.json "$RUNNER_TEMP/docs-check-artifact/.docs-build-metadata.json"
          node .docs-controller/scripts/legacy-pages.js import-dev \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/docs-check-artifact" "$RUNNER_TEMP/docs-check-verified"
      - name: Upload reviewable documentation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: docs-review-${{ github.event.pull_request.number || github.run_id }}
          path: docs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
