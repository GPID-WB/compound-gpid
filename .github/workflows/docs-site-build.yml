name: Build combined documentation
# Pull requests validate the source without receiving publication credentials.
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out proposed documentation source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - name: Build and validate the complete documentation tree
        run: npm run docs:build
      - name: Test navigation, search, and publication contracts
        run: npm run docs:test
      - name: Render reviewable HTML and search
        run: |
          npm run docs:render
          node scripts/check-rendered-docs.js .site
      - name: Check out current stable source for composition
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: main
          path: .docs-stable
          persist-credentials: false
      - name: Verify composition with the current stable channel
        run: |
          node scripts/rebuild-docs.js --root .docs-stable --all
          node scripts/check-docs-site.js --source-root .docs-stable --docs-root .docs-stable/docs --legacy
          node scripts/assemble-docs-site.js \
            --main-root .docs-stable --dev-root . --out .docs-combined \
            --main-sha "$(git -C .docs-stable rev-parse HEAD)" --dev-sha "$(git rev-parse HEAD)"
          node scripts/assemble-docs-site.js --verify .docs-combined --main-root .docs-stable --dev-root .
          node scripts/check-rendered-docs.js .docs-combined/site/dev
      - name: Upload reviewable documentation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: docs-review-${{ github.event.pull_request.number || github.run_id }}
          path: .site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
