name: Quick guide (published releases)

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * 1'

permissions:
  contents: read

jobs:
  # Additional evidence only; no required check or repository rule changes.
  quick-guide:
    name: Quick guide (published releases) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Run the page commands in disposable homes
        env:
          GH_TOKEN: ${{ github.token }}
          CG_QUICK_GUIDE_RELEASE_TEST: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest scripts/tests/test_quick_upgrade_guide.py -v --basetemp="${{ runner.temp }}/quick-guide"
