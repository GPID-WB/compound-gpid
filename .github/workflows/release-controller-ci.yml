name: Release controller CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main, dev, 'feat/**', 'fix/**', 'chore/**']
  workflow_dispatch:
    inputs:
      build_request:
        description: 'Sealed journal build-request locator'
        required: true
        type: string
      dispatch_nonce:
        description: 'Sealed dispatch nonce'
        required: true
        type: string

permissions:
  contents: read

jobs:
  register:
    concurrency:
      group: release-controller-control
      cancel-in-progress: false
    if: ${{ false && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release-control
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.register.outputs.source_sha }}
      build_spec: ${{ steps.register.outputs.build_spec }}
      controller_revision: ${{ steps.register.outputs.controller_revision }}
      wheel_digest: ${{ steps.register.outputs.wheel_digest }}
      produces_artifacts: ${{ steps.register.outputs.produces_artifacts }}
    env:
      CG_RELEASE_CONTROLLER_REVISION: ${{ vars.CG_RELEASE_CONTROLLER_REVISION }}
      CG_RELEASE_WHEEL_SHA256: ${{ vars.CG_RELEASE_WHEEL_SHA256 }}
      CONTROLLER_WHEEL_URL: ${{ vars.CG_RELEASE_CONTROLLER_WHEEL_URL }}
      BUILD_REQUEST: ${{ inputs.build_request }}
      DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
    steps:
      - name: Require reviewed installation pins
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CG_RELEASE_CONTROLLER_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CG_RELEASE_WHEEL_SHA256" =~ ^[0-9a-f]{64}$ ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ vars.CG_RELEASE_CONTROLLER_REPOSITORY }}
          ref: ${{ env.CG_RELEASE_CONTROLLER_REVISION }}
          persist-credentials: false
          path: _controller
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install independently pinned controller
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install uv==0.11.3
          uv sync --project _controller/packages/cg-release --python 3.12 --locked --no-install-project
          curl --fail --proto '=https' --tlsv1.2 "$CONTROLLER_WHEEL_URL" -o cg_release-0.1.0-py3-none-any.whl
          printf '%s  %s\n' "$CG_RELEASE_WHEEL_SHA256" cg_release-0.1.0-py3-none-any.whl | sha256sum --check --strict
          uv pip install --link-mode copy --python _controller/packages/cg-release/.venv/bin/python --no-deps cg_release-0.1.0-py3-none-any.whl
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app
        with:
          app-id: ${{ secrets.RELEASE_CONTROL_APP_ID }}
          private-key: ${{ secrets.RELEASE_CONTROL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: read
          permission-pull-requests: read
          permission-actions: read
          permission-administration: read
          permission-environments: read
          permission-secrets: read
      - name: Register exact run before any source job
        id: register
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        shell: bash
        run: |
          _controller/packages/cg-release/.venv/bin/python -I -m cg_release.build_worker register \
            --request-id "$BUILD_REQUEST" --nonce "$DISPATCH_NONCE"

  build:
    name: build
    needs: register
    if: ${{ github.event_name == 'workflow_dispatch' && needs.register.result == 'success' && needs.register.outputs.produces_artifacts == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CG_RELEASE_SOURCE_JOB: 'true'
      CG_RELEASE_SOURCE_SHA: ${{ needs.register.outputs.source_sha }}
      CG_RELEASE_BUILD_SPEC: ${{ needs.register.outputs.build_spec }}
      CG_RELEASE_WHEEL_SHA256: ${{ needs.register.outputs.wheel_digest }}
      CONTROLLER_WHEEL_URL: ${{ vars.CG_RELEASE_CONTROLLER_WHEEL_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.register.outputs.source_sha }}
          persist-credentials: false
          path: source
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ vars.CG_RELEASE_CONTROLLER_REPOSITORY }}
          ref: ${{ needs.register.outputs.controller_revision }}
          persist-credentials: false
          path: _controller
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install source-job helper from the registered pin
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install uv==0.11.3
          uv sync --project _controller/packages/cg-release --python 3.12 --locked --no-install-project
          curl --fail --proto '=https' --tlsv1.2 "$CONTROLLER_WHEEL_URL" -o cg_release-0.1.0-py3-none-any.whl
          printf '%s  %s\n' "$CG_RELEASE_WHEEL_SHA256" cg_release-0.1.0-py3-none-any.whl | sha256sum --check --strict
          uv pip install --link-mode copy --python _controller/packages/cg-release/.venv/bin/python --no-deps cg_release-0.1.0-py3-none-any.whl
      - name: Execute declared build in the isolated source directory
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/_controller/packages/cg-release/.venv/bin:$PATH"
          python -I -m cg_release.build_worker build --source "$GITHUB_WORKSPACE/source" --output "$RUNNER_TEMP/release-assets"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 7

  package:
    needs: register
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || needs.register.result == 'success') }}
    name: package-${{ matrix.os }}-py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.register.outputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned environment tool
        run: python -m pip install uv==0.11.3
      - name: Install locked package
        run: uv sync --project packages/cg-release --python "${{ matrix.python }}" --locked --group gpid-native
      - name: Offline contracts, build, and installed-wheel smoke checks
        run: uv run --project packages/cg-release --python "${{ matrix.python }}" --locked pytest packages/cg-release/tests -q
      - name: Build wheel and sdist with locked build dependencies
        run: uv run --project packages/cg-release --python "${{ matrix.python }}" --locked python -m build --no-isolation packages/cg-release

  ruff:
    needs: register
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || needs.register.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.register.outputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.11.3
      - run: uv run --project packages/cg-release --python 3.11 --locked ruff check packages/cg-release

  aggregate:
    name: release-controller-ci
    needs: [register, build, package, ruff]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the complete matrix and Ruff
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          RUFF_RESULT: ${{ needs.ruff.result }}
          REGISTER_RESULT: ${{ needs.register.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' }}
          BUILD_REQUIRED: ${{ needs.register.outputs.produces_artifacts }}
        run: python -c "import os,sys; keys=('PACKAGE_RESULT','RUFF_RESULT') + ((('REGISTER_RESULT',) + (('BUILD_RESULT',) if os.environ.get('BUILD_REQUIRED') != 'false' else ())) if os.environ.get('RELEASE_MODE') == 'true' else ()); sys.exit(0 if all(os.environ.get(key) == 'success' for key in keys) else 1)"
