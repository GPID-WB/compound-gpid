name: Copilot Issue Dispatch

# Stage 3 of the controlled Copilot issue-implementation pipeline:
# a manually triggered, single-issue dispatch. There is deliberately no
# recurring trigger, no multi-issue selection, no automatic use of merge
# tools, and no automatic state progression of project goals.
#
# The workflow reuses the Stage 2 readiness validator (scripts/issue_readiness.py)
# and ONLY runs trusted code from the default branch. It never checks out a PR
# head or any other untrusted ref. Issue bodies are treated as untrusted data
# throughout; the dispatcher (scripts/issue_dispatch.py) never interpolates
# issue content into a shell string.
#
# Credentials (created in repository settings, NOT by this workflow):
#   COPILOT_ASSIGN_TOKEN  - Copilot-assignment credential (issues write).
#   PROJECT_SYNC_TOKEN    - Project-synchronization credential (project write).
# Both are environment secrets on the 'copilot-dispatch' protected environment,
# requiring explicit human approval before any job receives them.
# Neither is a combined/god token, and neither is referenced by any
# pull_request or pull_request_target workflow that executes untrusted code.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to dispatch to the Copilot coding agent
        required: true
        type: number
      dry_run:
        description: >-
          True (default): validate readiness and report only, with zero GitHub
          mutations. False: run the live dispatch sequence.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  # One effective dispatch at a time. A second dispatch does NOT cancel the
  # in-flight run; it queues behind it.
  group: copilot-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch issue
    runs-on: ubuntu-24.04
    environment: copilot-dispatch
    permissions:
      contents: read
    steps:
      # Trusted checkout: only the default branch. Never a PR head or other
      # untrusted ref. The dispatcher/validator scripts come from the default
      # branch only.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Dispatch (dry-run or live)
        env:
          COPILOT_ASSIGN_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
          PROJECT_SYNC_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          args=(--issue "${ISSUE_NUMBER}")
          if [ "${DRY_RUN}" = "false" ]; then
            args+=(--no-dry-run)
          else
            args+=(--dry-run)
          fi
          python scripts/issue_dispatch.py "${args[@]}" --json
