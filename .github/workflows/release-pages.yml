name: Deploy release documentation
run-name: Deploy docs from ${{ inputs.build_run_id || github.event.workflow_run.id }}

on:
  workflow_run:
    workflows: ["Build release documentation", "Deploy documentation site"]
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Exact successful historical release-docs run in the reviewed recovery record
        required: true
        type: string

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  BUILD_RUN_ID: ${{ inputs.build_run_id || github.event.workflow_run.id }}
  LEGACY_MODE: ${{ github.event_name == 'workflow_dispatch' && 'recovery' || 'release' }}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  classify:
    if: (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.name == 'Build release documentation')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      full_site: ${{ steps.tag.outputs.full_site }}
    steps:
      - name: Check out protected tag classifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Classify the release without deployment permissions
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            RELEASE_TAG="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" --jq .head_branch)"
          fi
          full_site="$(node scripts/release-version.js --full-site-tag "$RELEASE_TAG")"
          echo "full_site=$full_site" >> "$GITHUB_OUTPUT"

  deploy:
    needs: classify
    if: needs.classify.outputs.full_site == 'true' && ((github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.name == 'Build release documentation'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out protected deployment controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"

      - name: Read-only authority for reviewed historical recovery
        if: github.event_name == 'workflow_dispatch'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: recovery-authority
        with:
          app-id: ${{ secrets.RELEASE_CONTROL_APP_ID }}
          private-key: ${{ secrets.RELEASE_CONTROL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-actions: read
          permission-administration: read

      - name: Check protected default policy and exact historical authority
        id: authority
        env:
          GH_TOKEN: ${{ steps.recovery-authority.outputs.token || github.token }}
        run: node scripts/legacy-pages.js check

      - name: Verify immutable archive bytes before extraction
        env:
          ARTIFACT_ID: ${{ steps.authority.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.authority.outputs.artifact_digest }}
        run: node scripts/legacy-pages.js archive "$ARTIFACT_ID" "$ARTIFACT_DIGEST"

      - name: Verify isolated dev archive before extraction
        if: steps.authority.outputs.dev_artifact_id != ''
        env:
          ARTIFACT_ID: ${{ steps.authority.outputs.dev_artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.authority.outputs.dev_artifact_digest }}
        run: node scripts/legacy-pages.js archive "$ARTIFACT_ID" "$ARTIFACT_DIGEST"

      - name: Download isolated dev documentation
        if: steps.authority.outputs.dev_artifact_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.authority.outputs.dev_artifact_id }}
          merge-multiple: true
          path: release-dev-artifact
          run-id: ${{ inputs.build_run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download exact release documentation artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          artifact-ids: ${{ steps.authority.outputs.artifact_id }}
          merge-multiple: true
          path: release-artifact
          run-id: ${{ inputs.build_run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify release tag, lineage, payload, and artifact
        env:
          ISOLATED_RELEASE: ${{ steps.authority.outputs.dev_artifact_id != '' }}
          GH_TOKEN: ${{ steps.recovery-authority.outputs.token || github.token }}
          RELEASE_TAG: ${{ steps.authority.outputs.release_tag }}
          RELEASE_SHA: ${{ steps.authority.outputs.release_sha }}
        run: |
          node scripts/legacy-pages.js check
          required_branch="$(node scripts/release-version.js --resolve-source)"
          git fetch origin "$required_branch" "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" "origin/$required_branch"
          mkdir -p release-validation/releases
          git show "$RELEASE_SHA:releases/$RELEASE_TAG.json" > "release-validation/releases/$RELEASE_TAG.json"
          git show "$RELEASE_SHA:releases/latest.json" > release-validation/releases/latest.json
          git show "origin/$required_branch:releases/latest.json" > release-validation/current-latest.json
          cmp -s "release-validation/releases/$RELEASE_TAG.json" release-validation/releases/latest.json
          cmp -s "release-validation/releases/$RELEASE_TAG.json" release-validation/current-latest.json \
            || { echo "Refusing to deploy an older release artifact."; exit 1; }
          node - "$RELEASE_TAG" <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");
          const tag = process.argv[2];
          const payload = JSON.parse(fs.readFileSync(`release-validation/releases/${tag}.json`, "utf8"));
          if (payload.tag !== tag || payload.schemaVersion !== 1 || !Array.isArray(payload.sections) || !payload.sections.length) {
            throw new Error("Invalid durable release payload.");
          }
          const root = "release-artifact";
           const docs = path.join(root, process.env.ISOLATED_RELEASE === "true" ? "docs" : "site");
          const metadata = JSON.parse(fs.readFileSync(path.join(root, ".docs-build-metadata.json"), "utf8"));
          if (metadata.schemaVersion !== 1 || !metadata.site || !metadata.site.files) {
            throw new Error("Invalid documentation build metadata.");
          }
          const actual = {};
          function walk(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const full = path.join(directory, entry.name);
              if (entry.isSymbolicLink()) throw new Error(`Artifact contains symbolic link: ${full}`);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile()) {
                const relative = path.relative(docs, full).split(path.sep).join("/");
                actual[relative] = crypto.createHash("sha256").update(fs.readFileSync(full)).digest("hex");
              }
            }
          }
          walk(docs);
          const expected = metadata.site.files;
          const actualNames = Object.keys(actual).sort();
          const expectedNames = Object.keys(expected).sort();
          if (JSON.stringify(actualNames) !== JSON.stringify(expectedNames)) throw new Error("Artifact file list mismatch.");
          for (const name of expectedNames) {
            if (actual[name] !== expected[name]) throw new Error(`Artifact digest mismatch: ${name}`);
          }
          NODE
          echo "RELEASE_BRANCH=$required_branch" >> "$GITHUB_ENV"

      - name: Check out exact release source as data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ steps.authority.outputs.release_sha }}
          path: release-source
          fetch-depth: 1
          persist-credentials: false

      - name: Check out current dev source as data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: dev
          path: current-dev
          fetch-depth: 0
          persist-credentials: false

      - name: Compose isolated producer artifacts with protected code
        if: steps.authority.outputs.dev_artifact_id != ''
        env:
          RELEASE_TAG: ${{ steps.authority.outputs.release_tag }}
          RELEASE_SHA: ${{ steps.authority.outputs.release_sha }}
        run: |
          node scripts/legacy-pages.js import-docs release-source release-artifact verified-staging/release
          node scripts/legacy-pages.js import-dev current-dev release-dev-artifact verified-staging/dev
          dev_sha="$(git -C current-dev rev-parse HEAD)"
          node scripts/assemble-docs-site.js --main-root release-source --dev-root current-dev --main-build verified-staging/release --dev-build verified-staging/dev --out composed-artifact --main-sha "$RELEASE_SHA" --dev-sha "$dev_sha" --main-branch "$RELEASE_BRANCH" --main-ref "$RELEASE_TAG"
          mv release-artifact release-build-artifact
          mv composed-artifact release-artifact

      - name: Verify combined release artifact and current dev freshness
        env:
          RELEASE_TAG: ${{ steps.authority.outputs.release_tag }}
          RELEASE_SHA: ${{ steps.authority.outputs.release_sha }}
        run: |
          dev_sha="$(git -C current-dev rev-parse HEAD)"
          node scripts/assemble-docs-site.js \
            --verify release-artifact \
            --main-root "$GITHUB_WORKSPACE/release-source" \
            --dev-root "$GITHUB_WORKSPACE/current-dev" \
            --main-sha "$RELEASE_SHA" \
            --dev-sha "$dev_sha" \
            --main-branch "$RELEASE_BRANCH" \
            --dev-branch dev \
            --main-ref "$RELEASE_TAG" \
            --dev-ref dev

      - name: Seal durable official snapshot in the Pages artifact
        env:
          GH_TOKEN: ${{ steps.recovery-authority.outputs.token || github.token }}
        run: node scripts/legacy-pages.js seal-official release-source release-artifact

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0

      - name: Upload verified release Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: release-artifact/site

      - name: Recheck release is still newest
        env:
          GH_TOKEN: ${{ steps.recovery-authority.outputs.token || github.token }}
          RELEASE_TAG: ${{ steps.authority.outputs.release_tag }}
          RELEASE_SHA: ${{ steps.authority.outputs.release_sha }}
        run: |
          test "$(RELEASE_SOURCE_BRANCH="$RELEASE_BRANCH" node scripts/release-version.js --resolve-source)" = "$RELEASE_BRANCH"
          git fetch origin "$RELEASE_BRANCH"
          git show "origin/$RELEASE_BRANCH:releases/latest.json" > release-validation/recheck-latest.json
          cmp -s release-validation/releases/latest.json release-validation/recheck-latest.json \
              || { echo "A newer release payload appeared before deployment."; exit 1; }
          node scripts/legacy-pages.js check

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5

  deploy-dev:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.name == 'Deploy documentation site'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    env:
      LEGACY_MODE: dev
    steps:
      - name: Check out exact protected default controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - id: authority
        run: node scripts/legacy-pages.js check
      - name: Restore durable official bytes from the current protected Pages deployment
        id: official
        run: node scripts/legacy-pages.js restore-official official-source official-state.json
      - name: Verify exact-run archive digest
        env:
          ARTIFACT_ID: ${{ steps.authority.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.authority.outputs.artifact_digest }}
        run: node scripts/legacy-pages.js archive "$ARTIFACT_ID" "$ARTIFACT_DIGEST"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.authority.outputs.artifact_id }}
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          path: dev-artifact
          github-token: ${{ github.token }}
      - name: Read exact dev canonical inputs as data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.authority.outputs.release_sha }}
          path: sources/dev
          persist-credentials: false
      - name: Verify full inventory and compose using trusted static-data code
        env:
          DEV_SHA: ${{ steps.authority.outputs.release_sha }}
          OFFICIAL_SHA: ${{ steps.official.outputs.official_sha }}
          OFFICIAL_BRANCH: ${{ steps.official.outputs.official_branch }}
          OFFICIAL_TAG: ${{ steps.official.outputs.official_tag }}
        run: |
          set -euo pipefail
          node scripts/legacy-pages.js import-dev sources/dev dev-artifact verified-staging/dev
          node scripts/assemble-docs-site.js --main-root official-source --dev-root sources/dev --dev-build verified-staging/dev --out combined-artifact --main-sha "$OFFICIAL_SHA" --dev-sha "$DEV_SHA" --main-branch "$OFFICIAL_BRANCH" --main-ref "$OFFICIAL_TAG"
          node scripts/assemble-docs-site.js --verify combined-artifact --main-root official-source --dev-root sources/dev --main-sha "$OFFICIAL_SHA" --dev-sha "$DEV_SHA" --main-branch "$OFFICIAL_BRANCH" --main-ref "$OFFICIAL_TAG"
          node scripts/legacy-pages.js stamp-preview official-state.json combined-artifact
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: combined-artifact/site
      - name: Recheck policy, actor authority and official snapshot after upload
        env:
          DEV_SHA: ${{ steps.authority.outputs.release_sha }}
        run: |
          node scripts/legacy-pages.js check
          node scripts/legacy-pages.js recheck-official official-state.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/dev" --jq .commit.sha)" = "$DEV_SHA"
      - name: Deploy development preview to GitHub Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
